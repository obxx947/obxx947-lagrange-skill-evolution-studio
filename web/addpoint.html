<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>舰船加点 — 拉格朗日智能体</title>
<link rel="icon" href="data:,">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter','Microsoft YaHei','PingFang SC',sans-serif;background:#0a0e1a;color:#e8f4ff;min-height:100vh;overflow-x:hidden}
:root{--bg2:#111827;--card:#1a2332;--card2:#141c2b;--border:#2d4a6f;--blue:#4a9eff;--cyan:#00d4ff;--gold:#ffd700;--green:#2ed573;--red:#ff4757;--t1:#e8f4ff;--t2:#8ba3c7;--t3:#5a7a9a}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:60}
.topbar .logo{font-size:0.84rem;font-weight:800;white-space:nowrap;background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar .links{display:flex;gap:4px;margin-left:auto}
.topbar .links a{color:var(--t2);text-decoration:none;font-size:0.64rem;padding:4px 7px;border-radius:6px;white-space:nowrap}
.topbar .links a:hover{color:#fff;background:rgba(255,255,255,.05)}
.wrap{max-width:1000px;margin:0 auto;padding:10px 10px 40px}

/* ---- 顶部：舰船选择 / 总消耗 / 重置 ---- */
.topctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 11px;margin-bottom:8px}
.topctl select{flex:1;min-width:150px;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:8px;color:var(--t1);padding:7px 9px;font-size:0.74rem;font-family:inherit;outline:none}
.topctl select:focus{border-color:var(--cyan)}
/* ---- 二选一：同位置多选项合成一张卡 + 右上角切换器 ---- */
.node.alt{border-color:var(--gold)}
.node.alt .altsw{position:absolute;top:3px;right:3px;display:flex;gap:3px;z-index:2}
.node.alt .altsw .altdot{width:15px;height:15px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid var(--border);
  color:var(--t3);font-size:0.5rem;line-height:13px;text-align:center;cursor:pointer;font-weight:700}
.node.alt .altsw .altdot:hover{border-color:var(--cyan);color:#fff}
.node.alt .altsw .altdot.on{background:var(--gold);border-color:var(--gold);color:#1a2332}
.node.alt .minus{right:auto;left:3px}
/* ---- 舰船搜索框 ---- */
.shipPick{position:relative;flex:1;min-width:210px}
.shipPick input{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:8px;color:var(--t1);padding:7px 9px;font-size:0.74rem;font-family:inherit;outline:none}
.shipPick input:focus{border-color:var(--cyan)}
.shipPick input::placeholder{color:var(--t3)}
.shipDrop{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:360px;overflow-y:auto;background:var(--card);border:1px solid var(--cyan);border-radius:10px;z-index:200;box-shadow:0 14px 34px rgba(0,0,0,.65)}
.shipDrop.show{display:block}
.shipDrop .grp{font-size:0.58rem;color:var(--t3);letter-spacing:1px;padding:7px 10px 3px;position:sticky;top:0;background:var(--card);border-bottom:1px solid rgba(45,74,111,.4)}
.shipDrop .it{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;font-size:0.72rem;color:var(--t2);cursor:pointer}
.shipDrop .it:hover,.shipDrop .it.on{background:rgba(0,212,255,.14);color:#fff}
.shipDrop .it b{font-weight:400;color:var(--t3);font-size:0.6rem;flex:0 0 auto}
.shipDrop .it.cur b{color:var(--cyan)}
.shipDrop .none{padding:12px;font-size:0.7rem;color:var(--t3);text-align:center}
.cost{display:flex;align-items:center;gap:5px;background:rgba(0,212,255,.1);border:1px solid var(--cyan);border-radius:9px;padding:6px 10px;white-space:nowrap}
.cost i{font-style:normal;font-size:0.6rem;color:var(--t2)}
.cost b{font-size:0.9rem;color:var(--cyan)}
.hex{display:inline-block;width:11px;height:12px;background:var(--cyan);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);flex:0 0 auto}
.btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--t2);border-radius:8px;padding:7px 11px;font-size:0.68rem;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn:hover{color:var(--t1);border-color:var(--blue)}
.btn.pri{background:rgba(0,212,255,.16);border-color:var(--cyan);color:#fff}
.btn.gold{color:var(--gold);border-color:var(--gold)}
.btn.red{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---- 主体：左系统 / 右网格 ---- */
.main{display:flex;gap:8px;align-items:flex-start}
@media(max-width:680px){.main{flex-direction:column}}
.syslist{flex:0 0 96px;display:flex;flex-direction:column;gap:7px;position:sticky;top:52px}
@media(max-width:680px){.syslist{flex:1 1 auto;flex-direction:row;overflow-x:auto;position:static;width:100%;padding-bottom:4px}}
.syscard{position:relative;background:var(--card);border:2px solid var(--border);border-radius:11px;padding:8px 6px 7px;cursor:pointer;text-align:center;transition:all .15s;user-select:none}
.syscard:hover{border-color:var(--blue)}
.syscard.on{border-color:var(--gold);background:linear-gradient(160deg,rgba(255,215,0,.13),rgba(0,0,0,.2))}
.syscard .nm{font-size:0.72rem;font-weight:700;line-height:1.25}
.syscard .sec{font-size:0.54rem;color:var(--t3);margin-top:2px;white-space:normal;word-break:break-word;line-height:1.3}
.syscard .bar{display:flex;gap:2px;margin-top:6px;justify-content:center}
.syscard .bar i{width:5px;height:5px;border-radius:1px;background:rgba(255,255,255,.16)}
.syscard .bar i.f{background:var(--gold)}
.syscard .lock{position:absolute;top:3px;right:4px;font-size:0.6rem}

.board{flex:1;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px}
.syshead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.syshead .t{font-size:0.8rem;font-weight:700}
.syshead .n{font-size:0.68rem;color:var(--var,var(--gold));background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.45);border-radius:7px;padding:2px 7px}
.scroll{overflow-x:auto;overflow-y:hidden;padding-bottom:4px}
.grid{position:relative}
.grid svg{position:absolute;left:0;top:0;pointer-events:none}

/* ---- 节点 ---- */
.node{position:absolute;border-radius:9px;border:2px solid #35516f;background:linear-gradient(150deg,#1c2740,#131a2a);
      display:flex;flex-direction:column;align-items:center;justify-content:flex-start;cursor:pointer;overflow:visible;
      transition:border-color .13s,transform .1s}
.node .lb{font-size:0.74rem;font-weight:800;margin-top:9px;line-height:1}
.node .nm{font-size:0.52rem;color:var(--t3);margin-top:3px;padding:0 3px;text-align:center;line-height:1.15;
          display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .ft{margin-top:auto;width:100%;text-align:center;font-size:0.7rem;font-weight:800;padding:2px 0 3px;border-top:1px solid rgba(255,255,255,.09)}
.node.avail{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(0,212,255,.28),0 0 10px rgba(0,212,255,.18)}
.node.avail:hover{transform:translateY(-2px)}
.node.has{border-color:var(--gold);background:linear-gradient(150deg,#2a2410,#171307)}
.node.has .ft{color:var(--gold)}
.node.avail .ft{color:var(--cyan)}
.node.locked{opacity:.55;cursor:not-allowed}
.node.locked .lb{color:var(--t2)}
.node.empty{border-style:dashed;border-color:#2a3d55;background:rgba(0,0,0,.18);opacity:.5;cursor:default}
.node.empty .lb{color:var(--t3);font-weight:600;font-size:0.62rem}
.node.max{border-color:var(--green)}
.node.max .ft{color:var(--green)}
.node .minus{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:6px;border:1px solid var(--red);
      background:#2a1116;color:var(--red);font-size:0.82rem;line-height:1;display:flex;align-items:center;justify-content:center;
      cursor:pointer;font-weight:800;z-index:4}
.node .minus:hover{background:var(--red);color:#fff}
.node .tbadge{position:absolute;top:-8px;left:-8px;width:19px;height:19px;border-radius:50%;font-size:0.6rem;font-weight:900;
      display:flex;align-items:center;justify-content:center;z-index:4;border:1px solid rgba(0,0,0,.5)}
.node .tbadge.t2{background:linear-gradient(135deg,#c084fc,#7c3aed);color:#fff}
.node .tbadge.t3{background:linear-gradient(135deg,#22d3ee,#0891b2);color:#04222a}
.node .tbadge.t4{background:linear-gradient(135deg,#fb923c,#ea580c);color:#2a1200}

/* ---- 选中节点详情 ---- */
.detail{background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:10px 11px;margin-top:10px}
.detail .dh{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px}
.detail .dh b{font-size:0.8rem}
.detail .tag{font-size:0.56rem;border-radius:6px;padding:1px 6px;border:1px solid var(--border);color:var(--t2)}
.detail .desc{font-size:0.7rem;color:var(--t1);line-height:1.75}
.detail .desc .hl{color:var(--cyan);font-weight:800}
.detail .lvtab{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.detail .lv{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:7px;padding:4px 7px;font-size:0.6rem;line-height:1.5;text-align:center}
.detail .lv.on{border-color:var(--gold);background:rgba(255,215,0,.12)}
.detail .lv i{display:block;font-style:normal;color:var(--t3);font-size:0.54rem}
.hint{font-size:0.62rem;color:var(--t3);line-height:1.7}
/* ---- 属性汇总 ---- */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:6px}
.srow{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.26);
      border:1px solid var(--border);border-radius:8px;padding:5px 7px;font-size:0.62rem}
/* 顶部实时数值栏：现在这艘船的准确数值（可手填覆盖） */
.liveBar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:6px 10px;margin:2px 0 8px;font-size:0.62rem;line-height:1.5}
.liveBar b{color:var(--cyan)}
.liveBar .k{color:var(--t3)}
.liveBar .seg{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;min-width:0}
.liveBar .seg+.seg{border-left:1px solid var(--border);padding-left:12px}
.liveBar input{width:62px;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:5px;color:var(--t1);font-size:0.6rem;padding:1px 4px}
.srow i{font-style:normal;color:var(--t2);flex:1 1 auto;min-width:0;white-space:normal;word-break:break-word;line-height:1.35}
.srow .auto{color:var(--t3);font-size:0.56rem;white-space:nowrap;opacity:.85}
.srow input{width:54px;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:6px;
      color:var(--cyan);padding:2px 4px;font-size:0.64rem;font-family:inherit;outline:none;text-align:right;flex:0 0 auto}
.srow input:focus{border-color:var(--cyan)}
.srow b{font-size:0.72rem;color:var(--t3);min-width:34px;text-align:right;flex:0 0 auto}
.srow.on{border-color:var(--cyan);background:rgba(0,212,255,.09)}
.srow.on b{color:var(--cyan)}
.srow.b{border-color:rgba(255,215,0,.4)}
.srow.b input{color:var(--gold)}
.srow.b input:focus{border-color:var(--gold)}
.srow.b.on{border-color:var(--gold);background:rgba(255,215,0,.09)}
.srow.b.on b{color:var(--gold)}
.unsure{margin-top:8px;background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.35);border-radius:9px;
      padding:8px 10px;font-size:0.62rem;color:var(--t2);line-height:1.75}
.unsure b{color:var(--gold)}
.warn{background:rgba(255,71,87,.1);border:1px solid var(--red);color:#ffb3ba;border-radius:9px;padding:9px 11px;font-size:0.7rem;line-height:1.7}
.ok{background:rgba(46,213,115,.1);border:1px solid var(--green);color:#b9f6ca;border-radius:9px;padding:7px 10px;font-size:0.66rem;margin-top:8px;display:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#1e2b3f;border:1px solid var(--border);
      color:var(--t1);padding:9px 15px;border-radius:10px;font-size:0.72rem;opacity:0;pointer-events:none;transition:all .22s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--red);color:#ffb3ba}
.sl{display:none}
</style>
</head>
<body>
<div class="topbar">
    <div class="logo">⬆ 舰船加点</div>
    <div class="links">
        <a href="#" id="backLink">← 返回配队</a>
        <a href="fleet.html">🚀 配队</a>
        <a href="chat.html">🤖 AI对话</a>
    </div>
</div>

<div class="wrap">
    <div class="topctl">
        <div class="shipPick">
            <input id="shipSearch" type="text" placeholder="🔍 搜索舰船：名字 / 拼音 / 编号" autocomplete="off" spellcheck="false">
            <div id="shipDrop" class="shipDrop"></div>
        </div>
        <div class="cost"><span class="hex"></span><i>总计使用技术值</i><b id="totalCost">0</b></div>
        <button class="btn red" onclick="resetAll()">重置</button>
        <button class="btn green" onclick="saveBuild()">💾 存本舰方案</button>
        <button class="btn" onclick="openBuilds()">📁 本舰方案列表</button>
        <button class="btn gold" onclick="copyCode()">导出配置码</button>
        <button class="btn" onclick="importCode()">导入配置码</button>
        <button class="btn green" onclick="saveSet()">💾 存总体加点方案</button>
        <button class="btn" onclick="openSets()">📁 总体加点方案</button>
        <button class="btn gold" onclick="exportCurrentAddpoint()">📤 导出当前加点</button>
        <button class="btn gold" onclick="exportAllAddpoints()">📤 导出全部加点</button>
        <button class="btn" onclick="$('apImp').click()">📥 导入加点文件</button>
        <input type="file" id="apImp" accept=".json" style="display:none" onchange="importAddpointsFile(this)">
    </div>
    <div id="modLine" class="hint" style="margin:-2px 0 6px 2px"></div>

    <div id="ctxLine" class="hint" style="margin:-2px 0 8px 2px"></div>

    <div id="liveBar" class="liveBar"></div>
    <div id="body"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ========== 舰船加点页 ==========
   数据：data/blueprint/<cdnId>.json（每艘船的加点树）
        data/blueprint_map.json（舰船库 slug → CDN 编号）
        data/blueprint_ships.json（有加点数据的舰船总表）
   节点含义：
     position [行,列]  列1 贴左侧主干；行 1 在最上
     parentId []       前置节点（必须全部已点开才解锁；空数组=根节点，一开始就能点）
     maxLevel          等级上限
     levelCost[]       每一级消耗的蓝点（逐级不同，可为 0）
     levelValue[]      每一级的数值（下标 = 等级）
     adjustTag=true    空槽（无数值、不可点）
     type 2/3/4        特殊节点（2=指挥策略 3=战术技能 4=特殊）
*/
const $ = s => document.getElementById(s);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const KEY = 'lagrange_addpoint';        // { [cdnId]: { lv:{}, manual:{} } }
const KEY_OLD = 'lagrange_addpoint_v0'; // 旧格式（直接 {nodeId:level}），做了兼容
const P = new URLSearchParams(location.search);
const TYPE_NAME = { 2: '指挥策略', 3: '战术技能', 4: '特殊' };
const SAVE = {};

/* 属性汇总分组。
   ⚠️ 唯一定义在 _build_bpstats.js，写进 data/blueprint_stats.json 的 groups 字段，这里读它。
      以前是三个文件各写一份（bpstats / simulator / addpoint），漏改一处就静默失效。 */
const NO_PCT = ['physResist', 'repairArmor', 'sysHp', 'weaponDuration', 'positionFix'];   // 不是百分比的几项
const CN_FALLBACK = {
  hp: '结构值', physResist: '物理抵抗', energyResist: '能量抗性', dmgBonus: '伤害加成', crit: '暴击',
  critDmg: '暴击伤害', lockReduction: '锁定减免', cooldownReduction: '冷却减免', singleDmg: '单发伤害',
  evasion: '闪避', interceptRate: '拦截率', atkReduction: '打击间隔缩短', hitBonus: '命中加成',
  lockEfficiency: '锁定效率', antiIntercept: '反拦截', enemyHitDown: '被命中率下降',
  aaLockDown: '受防空锁定效率下降', sysDmgReduce: '受系统伤害降低',
  siege: '攻城伤害', repairEff: '维修效率', repairArmor: '一次性维修装甲',
  multiTarget: '武器分散打击', denseFire: '密集射击', sysIntercept: '系统内导弹拦截率', positionFix: '站位调整',
  hangarDmg: '载机伤害', hangarHit: '载机命中', hangarEvasion: '载机闪避', hangarLock: '载机锁定时间',
  hangarCd: '载机武器冷却', hangarFlight: '载机飞行时间', hangarAaResist: '载机抗防空锁定',
  hangarCritRate: '机库暴击率', hangarCritDmg: '机库暴击伤害',
  hangarModuleDmg: '本系统载机伤害', hangarModuleHit: '本系统载机命中', hangarModuleEvasion: '本系统载机闪避',
  hangarModuleLock: '本系统载机锁定时间', hangarModuleCd: '本系统载机武器冷却', hangarModuleFlight: '本系统载机飞行时间',
  repairBonus: '维修量加成(手填)', hangarBonus: '机库加成(手填)',
};
let GROUP_A = [], GROUP_B = [], GROUP_H = [], GROUP_M = [];
function buildGroups() {
  const G = (STATS && STATS.groups) || null;
  const L = Object.assign({}, CN_FALLBACK, (STATS && STATS.labels) || {});
  const R = k => [k, L[k] || k, (NO_PCT.indexOf(k) >= 0 ? '' : '%')];
  if (!G) {                                   // 老 stats 文件兜底
    GROUP_A = ['hp', 'physResist', 'energyResist', 'dmgBonus', 'crit', 'lockReduction', 'cooldownReduction',
               'singleDmg', 'evasion', 'interceptRate'].map(R);
    GROUP_B = ['siege', 'repairBonus', 'hitBonus', 'hangarBonus'].map(R);
    GROUP_H = ['hangarCritRate', 'hangarCritDmg'].map(R);
    GROUP_M = ['atkReduction', 'antiIntercept', 'sysDmgReduce', 'positionFix', 'multiTarget',
               'hangarModule', 'lockEfficiency', 'denseFire', 'sysIntercept'];
    return;
  }
  GROUP_A = [].concat(G.attack || [], G.defense || []).map(R);
  GROUP_B = [].concat(G.misc || [], G.hangarModule || []).map(R);
  GROUP_H = (G.hangar || []).map(R);
  GROUP_M = [].concat(G.moduleOnly || [], (G.hangar || []).filter(k => /^hangarModule/.test(k)));
}

let STATS = null;        // data/blueprint_stats.json
let SYSMAP = null;       // data/blueprint_sysmap.json（系统 ↔ 模块）
let manual = {};         // B 组手填值
/* 从配队页带过来的【已选模块】，形如 "M:M1,A:A1,B:B1"
   ★ 超主力舰只选了 M1+C2，加点就只该有 M1+C2 的那些系统 */
let selMods = [];
(function () {
  const raw = P.get('mods') || '';
  selMods = raw.split(',').filter(Boolean).map(x => {
    const i = x.indexOf(':');
    return { key: x.slice(0, i), variant: x.slice(i + 1) };
  });
})();
/* 该系统是否应当出现在加点页 */
function sysVisible(sysId) {
  if (!selMods.length) return true;                       // 没带模块信息 → 全部显示
  const m = SYSMAP && SYSMAP[ship.id] && SYSMAP[ship.id].systems[sysId];
  if (!m) return true;                                     // 没映射到 → 保守显示
  if (m.scope === 'ship') return true;                     // 装甲/动力/指挥：舰船级，永远显示
  if (m.scope === 'module') return selMods.some(s => s.key === m.key && s.variant === m.variant);
  return true;
}
function hiddenSysCount() {

    + (skippedList.length > 12 ? '<br>，共 ' + skippedList.length + ' 个' : '') + '</div>');

      + '</div>');

  return '<div class="detail" style="margin-top:10px">'
    + '<div class="dh"><b>本船加点属性汇总</b>'

    + (cond ? '<span class="tag" style="color:var(--gold);border-color:var(--gold)">' + cond + ' 个条件触发</span>' : '')
    + (skipped ? '<span class="tag" style="color:var(--gold);border-color:var(--gold)">' + skipped + ' 个需手填</span>' : '')
    + (pureRef ? '<span class="tag" style="color:var(--red);border-color:var(--red)">' + pureRef + ' 个无译文</span>' : '')

    +   '整船合计不在这里列了 —— 上面那条实时数值栏看的就是整船结果。</div>'
    + sysBreakdownHtml()

}
function setManual(k, v) {
  const f = parseFloat(v);
  if (v === '' || isNaN(f)) delete manual[k]; else manual[k] = f;
  persist();
  // 就地更新该行的合计，不整页重渲染（否则输入框会失焦）
  const key = k;
  const rows = document.querySelectorAll('.sgrid .srow');
  for (const r of rows) r.classList.toggle('on', true);
  const { out } = computeStats();
  document.querySelectorAll('.sgrid .srow').forEach(r => {
    const nm = r.querySelector('i'); if (!nm) return;
    const found = GROUP_A.concat(GROUP_B).find(g => g[1] === nm.textContent);
    if (!found) return;
    const kk = found[0], m = (typeof manual[kk] === 'number' ? manual[kk] : 0);
    const a = GROUP_A.some(g => g[0] === kk) ? (Math.round((out[kk] || 0) * 100) / 100) : 0;
    const b = r.querySelector('b');
    if (b) b.textContent = Math.round((a + m) * 100) / 100 + (found[2] === '%' ? '%' : '');
    r.classList.toggle('on', !!(a + m));
  });
}
function fillDesc(n, level) {
  let d = n.baseDesc || '';
  if (!d) return { text: '', ok: false };
  const phs = [...new Set(d.match(/\{[0-9A-Za-z]+\}/g) || [])];
  const vals = (n.levelValue || [])[level];
  if (vals && vals.length === phs.length) {
    let t = d;
    phs.forEach((p, i) => { t = t.split(p).join('<span class="hl">' + esc(vals[i]) + '</span>'); });
    return { text: t, ok: true };
  }
  return { text: esc(d), ok: false };
}

function sysCardHtml(s, i) {

  return '<div class="syscard' + (i === sysIdx ? ' on' : '') + '" onclick="pickSys(' + i + ')">'

    + '</div>';
}

function boardHtml(s) {
  if (!s) return '<div class="warn">这艘船没有加点数据。</div>';
  const rows = Math.max(...s.nodes.map(n => n.position[0]));
  const cols = Math.max(...s.nodes.map(n => n.position[1]));
  const W = cols * NODE_W + (cols - 1) * GAP_X;
  const H = rows * NODE_H + (rows - 1) * GAP_Y;
  const at = n => ({ x: (n.position[1] - 1) * (NODE_W + GAP_X), y: (n.position[0] - 1) * (NODE_H + GAP_Y) });
  const byId = {}; s.nodes.forEach(n => byId[n.id] = n);

  // 连线：前置 → 本节点
  let lines = '';
  s.nodes.forEach(n => {
    const a = at(n);
    (n.parentId || []).forEach(pid => {
      const p = byId[pid]; if (!p) return;
      const b = at(p);
      const x1 = b.x + NODE_W, y1 = b.y + NODE_H / 2, x2 = a.x, y2 = a.y + NODE_H / 2;
      const on = nodeLv(pid) > 0;
      const stroke = on ? '#ffd700' : '#2d4a6f';
      const mx = (x1 + x2) / 2;
      lines += '<path d="M' + x1 + ' ' + y1 + ' H' + mx + ' V' + y2 + ' H' + x2 + '" fill="none" stroke="' + stroke + '" stroke-width="2" opacity="' + (on ? .85 : .5) + '"/>'
             + '<circle cx="' + x1 + '" cy="' + y1 + '" r="3" fill="none" stroke="' + stroke + '" stroke-width="2"/>';
    });
  });

  const nodes = s.nodes.map(n => {
    /* ★ 二选一：同位置多选项合成一张卡。不是"当前展示"的那个就跳过（位置重叠，画了也看不见） */
    const grp = altsOf(s, n);
    if (grp.length > 1) {
      const cur = altCurrent(s, grp);
      if (!cur || cur.id !== n.id) return '';
      const p0 = at(n);
      const L0 = nodeLv(n.id), mx0 = n.maxLevel || 1;
      const ok0 = unlocked(n), full0 = slotFull(s);
      const others = grp.filter(x => x.id !== n.id);
      const anyOtherLv = others.some(x => nodeLv(x.id) > 0);
      let cls0 = 'node alt';
      if (!ok0) cls0 += ' locked';
      else if (L0 > 0) cls0 += (L0 >= mx0 ? ' max' : ' has');
      else cls0 += ' avail';
      const badge0 = n.type ? '<span class="tbadge t' + n.type + '" title="' + (TYPE_NAME[n.type] || '') + '">' + (n.type === 2 ? '策' : n.type === 3 ? '⬆' : '★') + '</span>' : '';
      const minus0 = L0 > 0 ? '<span class="minus" onclick="event.stopPropagation();subPoint(' + n.id + ')" title="退一级">−</span>' : '';
      /* 切换器：把同位置的其它选项列成小圆点，点哪个切哪个 */
      const sw = grp.map((x, i) =>
        '<span class="altdot' + (x.id === n.id ? ' on' : '') + '" title="' + esc(x.name || '') + (nodeLv(x.id) > 0 ? '（已加点）' : '') +
        '" onclick="event.stopPropagation();switchAlt(' + x.id + ')">' + (i + 1) + '</span>').join('');
      let ft0;
      if (L0 > 0) ft0 = L0 + '/' + mx0;
      else if (!ok0) ft0 = '🔒';
      else { const c0 = nextCost(n); ft0 = c0 === null ? '—' : (c0 === 0 ? '免费' : '<span class="hex" style="width:8px;height:9px"></span> ' + c0); }
      return '<div class="' + cls0 + '" style="left:' + p0.x + 'px;top:' + p0.y + 'px;width:' + NODE_W + 'px;height:' + NODE_H + 'px"'
        + ' onclick="addPoint(' + n.id + ')" title="二选一：' + grp.map(x => esc(x.name || '')).join(' ／ ') + '">'
        + badge0 + minus0
        + '<div class="altsw">' + sw + '</div>'
        + '<div class="lb">' + esc(n.labelName || '·') + '</div>'
        + '<div class="nm">' + esc(n.name || '') + '</div>'
        + '<div class="ft">' + ft0 + '</div>'
        + '</div>';
    }
    const p = at(n);
    const L = nodeLv(n.id), mx = n.maxLevel || 1;
    const empty = isEmptyNode(n), ok = unlocked(n), full = slotFull(s);
    let cls = 'node';
    if (empty) cls += ' empty';
    else if (!ok) cls += ' locked';
    else if (L > 0) cls += (L >= mx ? ' max' : ' has');
    else cls += ' avail';
    const badge = n.type ? '<span class="tbadge t' + n.type + '" title="' + (TYPE_NAME[n.type] || '') + '">' + (n.type === 2 ? '策' : n.type === 3 ? '⬆' : '★') + '</span>' : '';
    const minus = L > 0 ? '<span class="minus" onclick="event.stopPropagation();subPoint(' + n.id + ')" title="退一级">−</span>' : '';
    let ft;
    if (empty) ft = '空槽';
    else if (L > 0) ft = L + '/' + mx;
    else if (!ok) ft = '🔒';
    else { const c = nextCost(n); ft = c === null ? '—' : (c === 0 ? '免费' : '<span class="hex" style="width:8px;height:9px"></span> ' + c); }
    const click = empty ? '' : ' onclick="addPoint(' + n.id + ')"';
    return '<div class="' + cls + '" style="left:' + p.x + 'px;top:' + p.y + 'px;width:' + NODE_W + 'px;height:' + NODE_H + 'px"' + click + ' title="' + esc(n.name || '') + '">'
      + badge + minus
      + '<div class="lb">' + esc(empty ? '＋' : (n.labelName || '·')) + '</div>'
      + '<div class="nm">' + esc(empty ? '' : (n.name || '')) + '</div>'
      + '<div class="ft">' + ft + '</div>'
      + '</div>';
  }).join('');

  const used = slotUsed(s), lim = s.enhanceLimit || 0;
  const bad = brokenNodes(s);
  return '<div class="syshead">'
    +   '<span class="t">' + esc(s.sysName || s.sysLabel || '') + '</span>'
    +   '<span class="n">' + used + '/' + lim + '</span>'
    +   (s.isWeaponSystem ? '<span class="tag" style="font-size:.56rem;border:1px solid var(--border);border-radius:6px;padding:1px 6px;color:var(--t2)">武器系统</span>' : '')
    +   '<span style="flex:1"></span>'
    +   '<span class="hint">点节点加点 · 右上角 − 退一级 · 灰=前置没开' + (s.nodes.some(n => altsOf(s, n).length > 1) ? ' · <b style="color:var(--gold)">金框=二选一</b>，右上角 ①② 切换（切了会把另一个的点数退回）' : '') + '</span>'
    + '</div>'
    + (bad.length ? '<div class="warn" style="margin-bottom:8px">⚠ ' + bad.length + ' 个已加点的节点前置没满足（'+ bad.map(n => esc(n.labelName || n.name)).join('、') +'），可能是导入的配置来自别的船。</div>' : '')
    + '<div class="scroll"><div class="grid" style="width:' + W + 'px;height:' + H + 'px">'
    +   '<svg width="' + W + '" height="' + H + '">' + lines + '</svg>' + nodes
    + '</div></div>';
}

function detailHtml() {
  const s = curSys();
  if (!s) return '';
  const n = selNode && s.nodes.find(x => x.id === selNode.id) ? selNode : null;
  if (!n) return '<div class="detail"><div class="hint">点上面任意一个节点，这里会显示它的<b>说明与每级数值</b>。</div></div>';
  const L = nodeLv(n.id), mx = n.maxLevel || 1;
  const st = STATS ? STATS.nodes[n.id] : null;
  const pureRef = st && st.pureRef;
  const d = pureRef ? { text: '', ok: false } : fillDesc(n, L);
  const tab = Array.from({ length: mx + 1 }, (_, k) => {
    const v = (n.levelValue || [])[k];
    const c = k > 0 ? (n.levelCost || [])[k - 1] : null;
    return '<div class="lv' + (k === L ? ' on' : '') + '"><i>' + (k === 0 ? '未点' : 'Lv' + k) + '</i>'
      + (v ? esc(v.join(' / ')) : '—') + (c !== null && c !== undefined ? '<i style="color:var(--cyan)">-' + c + '</i>' : '') + '</div>';
  }).join('');
  return '<div class="detail">'
    + '<div class="dh"><b>' + esc(n.name || n.labelName || '') + '</b>'
    +   '<span class="tag">' + esc(n.labelName || '') + '</span>'
    +   (n.type ? '<span class="tag" style="color:var(--cyan);border-color:var(--cyan)">' + (TYPE_NAME[n.type] || '') + '</span>' : '')
    +   '<span class="tag" style="color:var(--gold);border-color:var(--gold)">' + L + '/' + mx + '</span>'
    +   (L < mx && unlocked(n) ? '<span class="tag">下一级 -' + (nextCost(n) ?? 0) + '</span>' : '')
    + '</div>'
    + (pureRef
        ? '<div class="desc" style="color:var(--t2)">这条的说明在游戏数据里<b>只存了一个术语代号</b>：'
          + '<b style="color:var(--gold)">' + esc(pureRef) + '</b><br>'
          + '本工具没有这份术语表（官网也没公开这个文件），所以<b>翻译不出来</b>——'
          + '效果请你在游戏里点开这条看，然后填到下面的「手动追加」里。</div>'
        : '<div class="desc">' + (d.text || '<span class="hint">（这条没有说明文字）</span>') + '</div>')
    + (!pureRef && !d.ok ? '<div class="hint" style="margin-top:4px">↑ 原文照录（说明里的数值位与取值对不上，没敢代入）</div>' : '')
    + '<div class="lvtab">' + tab + '</div>'
    + (pureRef ? '<div class="hint" style="margin-top:6px">下面是数据里存的每级数值，但<b>不知道哪一列对应什么</b>，所以没敢自动计入汇总。</div>' : '')
    + '</div>';
}

function pickSys(i) { sysIdx = i; selNode = null; render(); }

/* ---------- 持久化 / 导入导出 ---------- */
/* 存档格式：{ [cdnId]: { lv:{nodeId:等级}, manual:{攻城/维修/命中/机库} } }
   旧格式是直接 {nodeId:等级}，用 normRec 兼容 */
function normRec(rec) {
  if (!rec || typeof rec !== 'object') return { lv: {}, manual: {} };
  if (rec.lv && typeof rec.lv === 'object') return { lv: Object.assign({}, rec.lv), manual: Object.assign({}, rec.manual || {}) };
  const l = {}; Object.keys(rec).forEach(k => { if (typeof rec[k] === 'number') l[k] = rec[k]; });
  return { lv: l, manual: {} };
}
function curRec() {
  const clean = {}; Object.keys(lv).forEach(k => { if (lv[k] > 0) clean[k] = lv[k]; });
  return { lv: clean, manual: Object.assign({}, manual) };
}
/* ---------- 方案（加点 + 模块组合）保存 / 读取 ----------
   一条方案 = { name, ship(CDN编号), shipName, mods:[{key,variant}], lv:{}, manual:{}, updatedAt } */
const BKEY = 'lagrange_addpoint_builds';
function loadBuilds() { try { return JSON.parse(localStorage.getItem(BKEY) || '[]') || []; } catch (e) { return []; } }
function storeBuilds(a) { try { localStorage.setItem(BKEY, JSON.stringify(a)); } catch (e) { } }
function modStr() { return selMods.map(s => s.key + s.variant).join('+'); }

function saveBuild() {
  if (!ship) return;
  const all = loadBuilds();
  /* 默认名要一眼看出这是【单舰】方案 —— 之前直接用舰名，和旁边的「存整套方案」混（用户 2026-09-25）。
     ⚠️ 这里只存【当前这一艘船】；要存所有舰船请用「💾 存总体加点方案」。 */
  const 点数 = Object.keys(lv).filter(k => lv[k] > 0).length;
  const def = '单舰·' + (ship.shipName || ship.id) + (modStr() ? ' ' + modStr() : '') + ' ' + 点数 + '点';
  const name = prompt('本舰方案名称\n\n只存【当前这一艘：' + (ship.shipName || ship.id) + '】（含模块组合 ' + (modStr() || '未指定') + '）\n要存【所有舰船】请关掉这个，改点「💾 存总体加点方案」：', def);
  if (!name) return;
  const rec = { name: name, ship: ship.id, shipName: ship.shipName, mods: selMods.slice(),
                lv: Object.assign({}, lv), manual: Object.assign({}, manual), updatedAt: Date.now() };
  const i = all.findIndex(x => x.name === name);
  if (i >= 0) { if (!confirm('已有同名方案，覆盖它？')) return; all[i] = rec; } else all.push(rec);
  storeBuilds(all);
  AP_DIRTY = false;                                  // 存过了 → 不再提醒
  toast('已存【本舰】方案「' + name + '」（' + (ship.shipName || ship.id) + ' · 模块 ' + (modStr() || '未指定') + '）');
}
function openBuilds() {
  const all = loadBuilds();
  if (!all.length) { toast('还没有保存过方案', 'err'); return; }
  const list = all.map((b, i) =>
    '<div class="detail" style="margin-bottom:6px"><div class="dh">'
    + '<b>' + esc(b.name) + '</b>'
    + '<span class="tag">' + esc(b.shipName || b.ship) + '</span>'
    + (b.mods && b.mods.length ? '<span class="tag" style="color:var(--cyan);border-color:var(--cyan)">' + esc(b.mods.map(m => m.key + m.variant).join('+')) + '</span>' : '')
    + '<span class="tag">' + Object.keys(b.lv || {}).filter(k => (b.lv[k] || 0) > 0).length + ' 点</span>'
    + '<span style="flex:1"></span>'
    + '<button class="btn pri" style="padding:3px 9px;font-size:0.6rem" onclick="applyBuild(' + i + ')">载入</button>'
    + '<button class="btn gold" style="padding:3px 9px;font-size:0.6rem" onclick="exportBuild(' + i + ')">导出</button>'
    + '<button class="btn red" style="padding:3px 9px;font-size:0.6rem" onclick="delBuild(' + i + ')">删</button>'
    + '</div></div>').join('');
  $('body').innerHTML = '<div class="detail"><div class="dh"><b>我的方案</b>'
    + '<span class="hint">（只针对某一艘船：加点 + 模块组合；要整套所有舰船请返回点「💾 存总体加点方案」）</span><span style="flex:1"></span>'
    + '<button class="btn" onclick="render()">返回加点</button></div>'
    + '<div class="hint" style="margin-bottom:8px">载入后会自动切到对应舰船，并把模块组合设为保存时的选择 —— 这样加点就只显示那套模块的系统。</div>'
    + list + '</div>';
}
function delBuild(i) {
  const all = loadBuilds(); if (!all[i]) return;
  if (!confirm('删除方案「' + all[i].name + '」？')) return;
  all.splice(i, 1); storeBuilds(all); openBuilds();
}
function applyBuild(i) {
  const b = loadBuilds()[i]; if (!b) return;
  selMods = (b.mods || []).slice();
  if (String(b.ship) !== String(ship.id)) { openShip(b.ship); }
  else { lv = Object.assign({}, b.lv || {}); manual = Object.assign({}, b.manual || {}); persist(); render(); }
  showModLine();
  toast('已载入「' + b.name + '」');
}
/* 顶部一行：当前按哪些模块过滤 */
function showModLine() {
  const el = $('modLine'); if (!el) return;
  if (!selMods.length) { el.innerHTML = '<span style="color:var(--t3)">未指定模块组合 → 显示全部系统。（从配队页点进来会带上你所选的模块）</span>'; return; }
  const hid = hiddenSysCount();
  el.innerHTML = '当前模块组合：<b style="color:var(--cyan)">' + esc(modStr()) + '</b>'
    + (hid ? '，据此<b>隐藏了 ' + hid + ' 个未选模块的系统</b>' : '')
    + '　<span style="color:var(--t3)">（换模块组合请回配队页；或用「保存方案」把组合一起存下来）</span>';
}

function persist() {
  if (!ship) return;
  SAVE[ship.id] = curRec(); saveStore();
  if (typeof AP_DIRTY !== 'undefined') AP_DIRTY = true;   // 有改动 → 离开页面时提醒
}
function codeOf() {
  if (!ship) return '';
  return btoa(unescape(encodeURIComponent(JSON.stringify(Object.assign({ v: 2, ship: ship.id }, curRec())))));
}
function copyCode() {
  const c = codeOf();
  if (!c) return;
  navigator.clipboard?.writeText(c).then(() => toast('配置码已复制（本工具的格式，不是游戏的分享码）'))
    .catch(() => { prompt('复制下面这串配置码：', c); });
}
function importCode() {
  const c = prompt('粘贴配置码（本工具导出的那种）：');
  if (!c) return;
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(c.trim()))));
    if (!o || !o.lv) throw new Error('格式不对');
    if (String(o.ship) !== String(ship.id)) {
      if (!confirm('这串配置属于另一艘船（' + o.ship + '）。仍然按本船节点 id 尽量套用？')) return;
    }
    lv = {}; Object.keys(o.lv || {}).forEach(k => { lv[k] = o.lv[k]; });
    manual = Object.assign({}, o.manual || {});
    // 不匹配的节点 id 会自然落空，here 提示一下
    const all = {}; ship.systems.forEach(s => s.nodes.forEach(n => all[n.id] = 1));
    const unknown = Object.keys(lv).filter(k => !all[k]).length;
    persist(); render();
    toast(unknown ? ('已导入，其中 ' + unknown + ' 个节点本船没有、已忽略') : '已导入');
  } catch (e) { toast('配置码无法解析', 'err'); }
}

/* ---------- 批量导出 / 导入（全部舰船加点 + 全部方案） ----------
   导出文件格式（自洽，可原样导回）：
   { type:'lagrange_addpoints', version:1, exportedAt, names:{船名}, addpoints:{cdnId:{lv,manual}}, builds:[方案] }
   · addpoints —— 「全部舰船加点」，空的船不写进文件
   · builds    —— 「我的方案」（每条 = 加点 + 模块组合），和 addpoints 同一个文件一起带走
   · 单条方案导出 走的是同一个格式（builds 里只放一条），所以两种文件都能用「导入加点文件」读回来 */
function dlFile(name, text) {
  const b = new Blob([text], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function nameMap() {
  const m = {};
  try { (SHIPS || []).forEach(s => { m[s.id] = s.shipName || s.name || ''; }); } catch (e) { }
  return m;
}
function bundleOf(addpoints, builds) {
  return { type: 'lagrange_addpoints', version: 1, exportedAt: new Date().toISOString(),
    note: '拉格朗日智能体3 · 舰船加点导出（addpoints=各舰船加点, builds=保存的方案含模块组合）',
    names: nameMap(), addpoints: addpoints || {}, builds: builds || [] };
}
/* 导出【当前这艘船正在配的这套加点】—— 不要求先保存方案。
   产出的是【可读】JSON（不是配置码那种 base64）：舰船名 / 模块组合 /
   每个已点亮节点（名字 + 所属系统 + 等级 + 说明原文）/ 手填四项 / 总计技术值。
   同一次导出也带一份精简的 lv/manual，所以导入侧（importAddpointsFile）也能吃。 */
/* ================= 整套加点方案（方案集）=================
   用户 2026-09-25 明确：保存的是【所有舰船的加点数据】，模拟器里选的也是这一整套。
   一条 = 某个时刻 localStorage['lagrange_addpoint'] 的完整快照。
   存在新键 lagrange_addpoint_sets（不影响旧的单船 builds）。 */
const SKEY = 'lagrange_addpoint_sets';
function loadSets() { try { return JSON.parse(localStorage.getItem(SKEY) || '[]') || []; } catch (e) { return []; } }
function storeSets(a) { try { localStorage.setItem(SKEY, JSON.stringify(a)); } catch (e) { } }
function setStat(dp) {
  const ids = Object.keys(dp || {});
  let pts = 0; ids.forEach(k => pts += Object.keys((dp[k] || {}).lv || {}).filter(x => (dp[k].lv[x] || 0) > 0).length);
  return ids.length + ' 艘 / ' + pts + ' 点';
}
function saveSet() {
  const snap = loadStore();                       // 全部舰船的加点
  const n = Object.keys(snap).length;
  if (!n) { toast('还没有任何舰船的加点可以存', 'err'); return null; }
  /* 默认名用「总体加点方案N」按序号递增（用户 2026-09-25：原来自动带舰船名/时间戳容易误会） */
  const used = loadSets().map(x => x && x.name).filter(Boolean);
  let k = 1; while (used.indexOf('总体加点方案' + k) >= 0) k++;
  const name = prompt('总体加点方案名称\n\n存的是【所有舰船】的加点（当前 ' + setStat(snap) + '）\n（只存某一艘船请关掉这个，用左边的「💾 存本舰方案」）：', '总体加点方案' + k);
  if (!name) return null;                            // 用户取消 → 调用方据此中止
  const all = loadSets();
  const rec = { name: name, addpoints: snap, updatedAt: Date.now() };
  const i = all.findIndex(x => x.name === name);
  if (i >= 0) { if (!confirm('已有同名总体加点方案，覆盖它？')) return null; all[i] = rec; } else all.push(rec);
  storeSets(all);
  AP_DIRTY = false;                                  // 存过了 → 不再提醒
  toast('已存总体加点方案「' + name + '」（' + setStat(snap) + '）');
  return name;
}
/* 载入整套：先清空本机全部加点，再把快照写回去（问一下，避免误覆盖） */
function applySet(i) {
  const all = loadSets(); const rec = all[i]; if (!rec) return;
  if (!confirm('载入「' + rec.name + '」会把本机【所有舰船】的加点换成这一套（当前那套会被覆盖）。继续？')) return;
  SAVE && Object.keys(SAVE).forEach(k => delete SAVE[k]);
  Object.keys(rec.addpoints || {}).forEach(k => { SAVE[k] = normRec(rec.addpoints[k]); });
  saveStore();
  if (ship) { const r = normRec(SAVE[ship.id]); lv = Object.assign({}, r.lv); manual = Object.assign({}, r.manual); }
  render(); toast('已载入整套方案「' + rec.name + '」（' + setStat(rec.addpoints) + '）');
}
function delSet(i) {
  const all = loadSets(); const rec = all[i]; if (!rec) return;
  if (!confirm('删除整套方案「' + rec.name + '」？')) return;
  all.splice(i, 1); storeSets(all); openSets(); toast('已删除');
}
function exportSet(i) {
  const all = loadSets(); const rec = all[i]; if (!rec) return;
  const safe = String(rec.name || '整套方案').replace(/[\/:*?"<>|\s]/g, '_').slice(0, 40);
  dlFile('拉格朗日_整套加点_' + safe + '.json',
    JSON.stringify(bundleOf(rec.addpoints || {}, []), null, 2));
  toast('已导出整套方案「' + rec.name + '」');
}
function openSets() {
  const all = loadSets();
  const rows = all.map((x, i) =>
    '<div class="detail" style="margin-bottom:6px"><div class="dh">'
    + '<b>' + esc(x.name) + '</b><span class="tag">' + setStat(x.addpoints) + '</span>'
    + '<span style="flex:1"></span>'
    + '<button class="btn pri" style="padding:3px 9px;font-size:0.6rem" onclick="applySet(' + i + ')">载入</button>'
    + '<button class="btn gold" style="padding:3px 9px;font-size:0.6rem" onclick="exportSet(' + i + ')">导出</button>'

    + '</div></div>').join('');
  $('body').innerHTML = '<div class="detail"><div class="dh"><b>总体加点方案</b>'
    + '<span class="hint">（每条 = 当时【所有舰船】的加点快照，默认名「总体加点方案N」）</span><span style="flex:1"></span>'
    + '<button class="btn green" onclick="saveSet()">💾 存当前为一套</button>'
    + '<button class="btn" onclick="render()">返回加点</button></div>'
    + '<div class="hint" style="margin-bottom:8px">在战斗模拟里，【每个舰队方框】右侧都能单独选一套（各用各的、互不影响）。</div>'
    + (rows || '<div class="empty">还没有总体加点方案。先把各舰船配好，然后点上面的「💾 存当前为一套」。</div>')
    + '</div>';
}
function exportCurrentAddpoint() {
    if (!ship) { toast('还没选舰船', 'err'); return; }
    const idx = {};
    (ship.systems || []).forEach(sy => (sy.nodes || []).forEach(n => { idx[n.id] = { sys: sy.sysName || '', n: n }; }));
    const nodes = Object.keys(lv).filter(k => lv[k] > 0)
        .map(k => ({ id: k, 节点: (idx[k] && idx[k].n && idx[k].n.name) || k, 系统: (idx[k] && idx[k].sys) || '', 等级: lv[k],
                     说明: String((idx[k] && idx[k].n && idx[k].n.baseDesc) || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim() }))
        .sort((a, b) => String(a.系统).localeCompare(String(b.系统), 'zh') || a.等级 - b.等级);
    const tcEl = document.getElementById('totalCost');

    const doc = {

        version: 1,
        exportedAt: new Date().toISOString(),
        note: '舰船加点·当前这套（含模块组合）。已点亮的节点按系统排好；手填=引擎里没有对应字段的那几项。',
        舰船: ship.shipName || ship.id,
        官方编号: ship.id,
        模块组合: (typeof selMods !== 'undefined' ? selMods : []).map(m => m.key + m.variant),
        一共点亮: nodes.length + ' 个节点',
        总计技术值: tcEl ? tcEl.textContent : '',
        已点亮节点: nodes,
        手填: manual2,
        addpoints: { [ship.id]: curRec() },     // 精简版：能被 importAddpointsFile 读回
        builds: []

    toast('已导出「' + (ship.shipName || ship.id) + '」当前加点（' + nodes.length + ' 个节点）');

function exportAllAddpoints() {
  const addpoints = {};
  Object.keys(SAVE).forEach(k => {
    const r = normRec(SAVE[k]);
    if (!Object.keys(r.lv).length && !Object.keys(r.manual).length) return;   // 空配置不导出
    addpoints[k] = r;
  });
  const builds = loadBuilds();
  const n = Object.keys(addpoints).length;
  if (!n && !builds.length) { toast('还没有任何加点或方案可以导出', 'err'); return; }
  const stamp = new Date().toISOString().slice(0, 10);
  dlFile('拉格朗日_全部舰船加点_' + stamp + '.json', JSON.stringify(bundleOf(addpoints, builds), null, 2));
  toast('已导出 ' + n + ' 艘舰船的加点' + (builds.length ? ' + ' + builds.length + ' 个方案' : ''));
}
function exportBuild(i) {
  const b = loadBuilds()[i]; if (!b) return;
  const safe = String(b.name || '方案').replace(/[\\/:*?"<>|\s]/g, '_').slice(0, 40);
  dlFile('拉格朗日_加点方案_' + safe + '.json', JSON.stringify(bundleOf({}, [b]), null, 2));
  toast('已导出方案「' + b.name + '」');
}
function importAddpointsFile(inp) {
  const f = inp.files && inp.files[0]; if (!f) { return; }
  const rd = new FileReader();
  rd.onload = () => {
    let j = null;
    try { j = JSON.parse(String(rd.result)); } catch (e) { toast('JSON 解析失败', 'err'); inp.value = ''; return; }
    if (!j || (j.type !== 'lagrange_addpoints' && !j.addpoints && !Array.isArray(j.builds))) {
      toast('不是本工具导出的加点文件', 'err'); inp.value = ''; return;
    }
    const merge = confirm('点【确定】= 合并（同名/同船覆盖，其余保留）\n点【取消】= 覆盖（先清空本机全部加点与方案再导入）\n\n文件里：加点 '
      + Object.keys(j.addpoints || {}).length + ' 艘 · 方案 ' + ((j.builds || []).length) + ' 个');
    if (!merge) {
      Object.keys(SAVE).forEach(k => delete SAVE[k]);
      storeBuilds([]);
    }
    let na = 0;
    Object.keys(j.addpoints || {}).forEach(k => { SAVE[k] = normRec(j.addpoints[k]); na++; });
    saveStore();
    const all = loadBuilds();
    let nb = 0;
    (j.builds || []).forEach(b => {
      if (!b || !b.name) return;
      const i = all.findIndex(x => x.name === b.name);
      if (i >= 0) all[i] = b; else all.push(b);
      nb++;
    });
    if (nb) storeBuilds(all);
    if (ship) {                                   // 当前这艘船跟着刷新
      const rec = normRec(SAVE[ship.id]);
      SAVE[ship.id] = rec;
      lv = Object.assign({}, rec.lv); manual = Object.assign({}, rec.manual);
      render();
    }
    inp.value = '';
    toast('已导入 ' + na + ' 艘船的加点' + (nb ? ' + ' + nb + ' 个方案' : '') + '（' + (merge ? '合并' : '覆盖') + '）');
  };
  rd.readAsText(f, 'utf-8');
}

/* ---------- 舰船搜索 ----------
   支持三种查法：中文名子串 / 拼音连打（sha long → shalong）/ 拼音首字母（sl）/ 官方编号（10201）。
   命中结果按舰种分组，↑↓ 选、Enter 确认、Esc 取消。 */
const KIND = { 1: '战机', 2: '护航艇', 3: '护卫舰', 4: '驱逐舰', 5: '巡洋舰', 6: '战巡', 7: '支援舰', 8: '航母', 9: '战列舰' };
const S_NAME = {}, S_PY = {}, S_ABBR = {};
let dropIdx = -1, dropList = [];

/* 拼音音节表：用来把 shalong 切成 sha|long → 取首字母 sl。
   没有音节表的话只能按 `-` 分段取首字母，砂龙会变成 sd（错），所以要切开。 */
const PY_SYL = new Set(('a ai an ang ao ba bai ban bang bao bei ben beng bi bian biao bie bin bing bo bu ' +
  'ca cai can cang cao ce cen ceng cha chai chan chang chao che chen cheng chi chong chou chu chua chuai chuan chuang chui chun chuo ci cong cou cu cuan cui cun cuo ' +
  'da dai dan dang dao de dei deng di dian diao die ding diu dong dou du duan dui dun duo ' +
  'e ei en eng er fa fan fang fei fen feng fo fou fu ' +
  'ga gai gan gang gao ge gei gen geng gong gou gu gua guai guan guang gui gun guo ' +
  'ha hai han hang hao he hei hen heng hong hou hu hua huai huan huang hui hun huo ' +
  'ji jia jian jiang jiao jie jin jing jiong jiu ju juan jue jun ' +
  'ka kai kan kang kao ke ken keng kong kou ku kua kuai kuan kuang kui kun kuo ' +
  'la lai lan lang lao le lei leng li lia lian liang liao lie lin ling liu long lou lu luan lun luo lv lve ' +
  'ma mai man mang mao me mei men meng mi mian miao mie min ming miu mo mou mu ' +
  'na nai nan nang nao ne nei nen neng ni nian niang niao nie nin ning niu nong nou nu nuan nuo nv nve ' +
  'o ou pa pai pan pang pao pei pen peng pi pian piao pie pin ping po pou pu ' +
  'qi qia qian qiang qiao qie qin qing qiong qiu qu quan que qun ' +
  'ran rang rao re ren reng ri rong rou ru ruan rui run ruo ' +
  'sa sai san sang sao se sen seng sha shai shan shang shao she shen sheng shi shou shu shua shuai shuan shuang shui shun shuo si song sou su suan sui sun suo ' +
  'ta tai tan tang tao te teng ti tian tiao tie ting tong tou tu tuan tui tun tuo ' +
  'wa wai wan wang wei wen weng wo wu ' +
  'xi xia xian xiang xiao xie xin xing xiong xiu xu xuan xue xun ' +
  'ya yan yang yao ye yi yin ying yo yong you yu yuan yue yun ' +
  'za zai zan zang zao ze zei zen zeng zha zhai zhan zhang zhao zhe zhen zheng zhi zhong zhou zhu zhua zhuai zhuan zhuang zhui zhun zhuo zi zong zou zu zuan zui zun zuo').split(' '));

function pyInitials(s) {
  s = String(s || '').toLowerCase().replace(/[^a-z]/g, '');
  let out = '', i = 0;
  while (i < s.length) {
    let hit = '';
    for (let L = Math.min(6, s.length - i); L >= 1; L--) { const t = s.substr(i, L); if (PY_SYL.has(t)) { hit = t; break; } }
    if (!hit) hit = s[i];                    // 切不出来的当单字母
    out += hit[0]; i += hit.length;
  }
  return out;
}
function buildShipIndex() {
  SHIPS.forEach(s => {
    S_NAME[s.id] = String(s.name || '').toLowerCase();
    const py = String(s.namePinyin || '').toLowerCase();
    S_PY[s.id] = py.replace(/[^a-z0-9]/g, '');
    // 首字母：先按拼音里的 `-` 分段，每段再切音节取首字母（砂龙 → shalong → sl）
    S_ABBR[s.id] = py.split(/[^a-z]+/).filter(Boolean).map(pyInitials).join('')
                 + py.replace(/[a-z]/g, '').replace(/[^0-9]/g, '');   // 型号里的数字也留一份
  });
}
function shipHit(q) {
  const raw = q.trim().toLowerCase();
  if (!raw) return SHIPS.slice();
  const qp = raw.replace(/[^a-z0-9\u4e00-\u9fa5]/g, '');
  return SHIPS.filter(s => S_NAME[s.id].indexOf(raw) >= 0 || String(s.id).indexOf(raw) >= 0
    || (qp && (S_PY[s.id].indexOf(qp) >= 0 || S_ABBR[s.id].indexOf(qp) >= 0)));
}
function renderDrop(q) {
  dropList = shipHit(q);
  dropIdx = dropList.length ? 0 : -1;
  const dd = $('shipDrop');
  if (!dropList.length) { dd.innerHTML = '<div class="none">没找到匹配的舰船</div>'; dd.classList.add('show'); return; }
  let html = '', last = null;
  dropList.forEach((s, i) => {
    if (s.shipType !== last) { last = s.shipType; html += '<div class="grp">' + (KIND[last] || '其他') + '</div>'; }
    html += '<div class="it' + (i === 0 ? ' on' : '') + (String(s.id) === String(curId) ? ' cur' : '') + '" data-i="' + i + '">'
          + '<span>' + esc(s.name) + '</span><b>#' + s.id + '</b></div>';
  });
  dd.innerHTML = html;
  dd.classList.add('show');
  dd.querySelectorAll('.it').forEach(el => {
    el.onmousedown = ev => { ev.preventDefault(); pickDrop(+el.dataset.i); };
  });
}
function pickDrop(i) {
  const s = dropList[i]; if (!s) return;
  closeDrop();
  if (String(s.id) !== String(curId)) openShip(s.id); else syncSearchBox();
  $('shipSearch').blur();
}
function closeDrop() { $('shipDrop').classList.remove('show'); dropIdx = -1; }
function moveDrop(d) {
  if (!$('shipDrop').classList.contains('show')) return;
  const its = $('shipDrop').querySelectorAll('.it'); if (!its.length) return;
  dropIdx = (dropIdx + d + its.length) % its.length;
  its.forEach((el, i) => el.classList.toggle('on', i === dropIdx));
  its[dropIdx].scrollIntoView({ block: 'nearest' });
}
function syncSearchBox() {
  const cs = SHIPS.find(s => String(s.id) === String(curId));
  $('shipSearch').value = cs ? cs.name : '';
}
function wireSearchBox() {
  const si = $('shipSearch');
  si.onfocus = () => { si.select(); renderDrop(''); };
  si.oninput = () => renderDrop(si.value);
  si.onkeydown = ev => {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); moveDrop(1); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); moveDrop(-1); }
    else if (ev.key === 'Enter') { ev.preventDefault(); if (dropIdx >= 0) pickDrop(dropIdx); }
    else if (ev.key === 'Escape') { closeDrop(); syncSearchBox(); si.blur(); }
  };
  document.addEventListener('mousedown', ev => { if (!ev.target.closest('.shipPick')) closeDrop(); });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeDrop(); });
}

/* ---------- 启动 ---------- */
function ctxLine() {
  const nm = P.get('name') || (ship && ship.shipName) || '';
  const parts = [];
  if (P.get('fleet')) parts.push('来自舰队「' + P.get('fleet') + '」');
  if (P.get('mods')) parts.push('模块 ' + P.get('mods').replace(/,/g, ' · '));
  if (P.get('airname')) parts.push('载机「' + P.get('airname') + '」');
  if (P.get('qty')) parts.push('本队 ' + P.get('qty') + ' 艘');
  $('ctxLine').innerHTML = nm ? ('<b style="color:var(--t1)">' + esc(nm) + '</b>' + (parts.length ? ' ｜ ' + esc(parts.join(' ｜ ')) : '')) : '';
}

async function boot() {
  ctxLine();
  try {
    const [ships, map, stats, sm] = await Promise.all([
      fetch('data/blueprint_ships.json', { cache: 'no-cache' }).then(r => r.json()),
      fetch('data/blueprint_map.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => ({})),
      fetch('data/blueprint_stats.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => null),
      fetch('data/blueprint_sysmap.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => null)
    ]);
    SHIPS = ships; SHIPMAP = map; STATS = stats; SYSMAP = sm;
    buildGroups();                                   // ★ 分组从 stats.groups 读（唯一来源）
  } catch (e) { $('body').innerHTML = '<div class="warn">读不到加点数据（data/blueprint_ships.json）。请从配队页正常进入，或确认文件存在。</div>'; return; }

  /* ---- 舰船搜索：索引在数据载入后建，行为函数在顶层（openShip 也要用） ---- */
  buildShipIndex();
  syncSearchBox(); closeDrop();
  wireSearchBox();

  // 从配队页进来：把 slug 换成 CDN 编号
  const slug = P.get('ship');
  const entry = slug && SHIPMAP ? SHIPMAP[slug] : null;
  let want = entry && entry.cdnId ? String(entry.cdnId) : (P.get('bp') || '');
  let matched = !!want;                       // 是否真的定位到这艘船
  if (!want) {
    // 没有来源就按名字找一次
    const nm = P.get('name');
    if (nm) { const f = SHIPS.find(s => s.name === nm || s.name.indexOf(nm) >= 0); if (f) { want = String(f.id); matched = true; } }
  }
  if (!want) want = String(SHIPS[0].id);

  // 只有在「确实没有这艘船的加点数据」时才警告——按名字找回来的不算
  if (slug && !matched) {
    $('ctxLine').innerHTML += ' <span style="color:var(--red)">（官方加点数据里没有这艘船，下面显示的是别的船）</span>';
  } else if (slug && entry && !entry.exact && !entry.viaAlias) {
    $('ctxLine').innerHTML += ' <span style="color:var(--t3)">（按名近似匹配到「' + esc(entry.cdnName || '') + '」）</span>';
  }
  openShip(want);
}

async function openShip(cdnId) {
  if (!SHIPS.some(s => String(s.id) === String(cdnId))) cdnId = String(SHIPS[0].id);
  curId = String(cdnId);
  syncSearchBox(); closeDrop();
  try {
    ship = await fetch('data/blueprint/' + cdnId + '.json', { cache: 'no-cache' }).then(r => r.json());
  } catch (e) { $('body').innerHTML = '<div class="warn">读不到 ' + cdnId + '.json</div>'; return; }
  const rec = normRec(SAVE[ship.id]);
  SAVE[ship.id] = rec;
  lv = Object.assign({}, rec.lv || {});
  manual = Object.assign({}, rec.manual || {});
  sysIdx = 0; selNode = null;
  document.title = '加点 · ' + ship.shipName + ' — 拉格朗日智能体';
  render();
}

(async () => {
  const s = loadStore(); Object.keys(s).forEach(k => SAVE[k] = s[k]);
  $('backLink').href = 'fleet.html';
  await boot();
})();
</script>
</body>
</html>
