<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技能/工具管理 — 拉格朗日智能体</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Microsoft YaHei','PingFang SC',sans-serif;background:#0a0e1a;color:#e8f4ff;min-height:100vh}
:root{--bg2:#111827;--card:#1a2332;--border:#2d4a6f;--blue:#4a9eff;--cyan:#00d4ff;--gold:#ffd700;--green:#2ed573;--red:#ff4757;--t1:#e8f4ff;--t2:#8ba3c7;--t3:#5a7a9a}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--bg2);border-bottom:1px solid var(--border)}
.topbar .logo{font-size:0.95rem;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar .links{display:flex;gap:8px}
.topbar .links a{color:var(--t2);text-decoration:none;font-size:0.7rem;padding:5px 10px;border-radius:6px;transition:all .2s}
.topbar .links a:hover{color:#fff;background:rgba(255,255,255,.05)}
.container{max-width:860px;margin:0 auto;padding:20px}
.sec-title{font-size:0.9rem;font-weight:700;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.sec-title .cnt{font-size:0.65rem;color:var(--t3);font-weight:400}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-head .name{font-weight:700;font-size:0.82rem}
.card-head .summary{font-size:0.7rem;color:var(--t2);flex:1;min-width:120px}
.card-head .badge{font-size:0.58rem;padding:2px 8px;border-radius:10px;border:1px solid var(--border);color:var(--t3)}
.card-head .badge.ok{color:var(--green);border-color:var(--green)}
.card-head .badge.no{color:var(--red);border-color:var(--red)}
.card-head .badge.pending{color:var(--gold);border-color:var(--gold)}
.card-body{display:none;margin-top:10px;border-top:1px solid rgba(255,255,255,.07);padding-top:10px;font-size:0.72rem;line-height:1.7;color:var(--t2);white-space:pre-wrap;word-break:break-word}
.card-body.show{display:block}
.card-body .basis{background:rgba(46,213,115,.06);border:1px solid rgba(46,213,115,.2);border-radius:8px;padding:8px 10px;margin:8px 0;color:var(--green)}
.card-body code{display:block;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px;margin:8px 0;overflow-x:auto;font-size:0.65rem;white-space:pre-wrap;color:var(--t1)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--t2);border-radius:6px;padding:4px 12px;font-size:0.65rem;cursor:pointer;transition:all .15s}
.btn:hover{color:var(--t1);border-color:var(--blue)}
.btn.green{color:var(--green);border-color:var(--green)}
.btn.green:hover{background:rgba(46,213,115,.1)}
.btn.red{color:var(--red);border-color:var(--red)}
.btn.red:hover{background:rgba(255,71,87,.1)}
.btn.gold{color:var(--gold);border-color:var(--gold)}
.btn.gold:hover{background:rgba(255,215,0,.08)}
.empty{color:var(--t3);font-size:0.7rem;padding:20px;text-align:center}
.form-grid{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.form-grid label{font-size:0.68rem;color:var(--t2)}
.form-grid input,.form-grid textarea{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:8px;color:var(--t1);padding:8px 12px;font-size:0.75rem;outline:none;font-family:inherit}
.form-grid input:focus,.form-grid textarea:focus{border-color:var(--blue)}
.form-grid textarea{min-height:120px;resize:vertical;font-family:monospace;font-size:0.68rem}
.toast{position:fixed;top:20px;right:20px;padding:10px 18px;border-radius:8px;font-size:0.78rem;z-index:999;transition:all .3s;opacity:0;transform:translateY(-10px)}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:#1a3a2a;border:1px solid var(--green);color:var(--green)}
.toast.err{background:#3a1a1a;border:1px solid var(--red);color:var(--red)}
.meta{font-size:0.58rem;color:var(--t3);margin-top:6px}
/* 手机端底部 Tab 导航 */
#mobileTabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:1200;background:#111827;border-top:1px solid var(--border);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
body.mobile-ui #mobileTabbar{display:flex}
#mobileTabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--t3);font-size:0.62rem;cursor:pointer;padding:6px 2px;border-radius:10px}
#mobileTabbar .tab .ti{font-size:1.2rem;line-height:1}
#mobileTabbar .tab.active{color:var(--cyan)}
#mobileTabbar .tab:active{background:rgba(74,158,255,0.1)}
body.mobile-ui{overflow:auto;-webkit-overflow-scrolling:touch}
body.mobile-ui .topbar .links{display:none}
body.mobile-ui .container{padding-bottom:calc(20px + env(safe-area-inset-bottom) + 60px)}
</style>
</head>
<body>
<div class="topbar">
    <div class="logo">🧠 技能 / 工具管理</div>
    <div class="links">
        <a href="chat.html">🤖 AI对话</a>
        <a href="features.html">🗺️ 功能</a>
        <a href="index.html">⚓ 模拟器</a>
        <a href="settings.html">⚙️ 设置</a>
    </div>
</div>
<div class="container">
    <div class="sec-title">⭐ 经验 Skill <span class="cnt" id="skillCnt"></span></div>
    <div style="background:rgba(74,158,255,.06);border:1px solid rgba(74,158,255,.2);border-radius:8px;padding:8px 12px;font-size:0.65rem;color:var(--cyan);line-height:1.6;margin-bottom:8px;">
        💡 在对话中给 AI 回答点赞/点踩，系统会自动反思整段对话并沉淀为 skill。相关 skill 会按关键词自动注入后续对话；输入 <code>/skill 名称</code> 可强制完整注入。用户画像只注入精简摘要。
    </div>
    <div id="skillList"></div>

    <div class="sec-title">🧰 自定义工具 <span class="cnt" id="toolCnt"></span></div>
    <div style="background:rgba(74,158,255,.06);border:1px solid rgba(74,158,255,.2);border-radius:8px;padding:8px 12px;font-size:0.65rem;color:var(--cyan);line-height:1.6;margin-bottom:8px;">
        💡 AI 在对话中可自主调用 create_tool 创建工具（用户不插手），创建后自动经「语法编译 + LLM逻辑审查」自检，通过即激活可用，不通过自动修复。此处可停用/删除/重检/手写工具。
    </div>
    <div id="toolList"></div>

    <div class="card">
        <div class="card-head"><span class="name">➕ 手写新工具</span></div>
        <div class="form-grid">
            <label>工具名称（英文/数字，如 calculate_ttk）</label>
            <input type="text" id="nt_name" placeholder="calculate_ttk">
            <label>作用标注（管理页与 AI 可见：这工具做什么）</label>
            <input type="text" id="nt_purpose" placeholder="计算舰队击杀时间（TTK）">
            <label>代码（必须是 async (args, emit) => 返回值，返回字符串或对象）</label>
            <textarea id="nt_code" placeholder="async (args, emit) => {&#10;  const hp = Number(args.hp||0), dpm = Number(args.dpm||0);&#10;  if(!dpm) return '请提供dpm';&#10;  return 'TTK ≈ ' + (hp/dpm*60).toFixed(1) + ' 秒';&#10;}"></textarea>
            <div class="actions">
                <button class="btn gold" onclick="createManualTool()">🔍 自检并创建</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-head"><span class="name">✍️ 手写新 Skill（经验沉淀）</span></div>
        <div class="form-grid">
            <label>Skill 名称（如 470抗伤配队）</label>
            <input type="text" id="ns_name" placeholder="470抗伤配队">
            <label>摘要（≤20字，管理页展示）</label>
            <input type="text" id="ns_summary" placeholder="470抗伤优先生存">
            <label>触发关键词（逗号分隔，5个以内）</label>
            <input type="text" id="ns_keywords" placeholder="470,抗伤,护航,生存">
            <label>Skill 全文（可直接注入系统提示词的指令文本）</label>
            <textarea id="ns_content" placeholder="配470人口抗伤队时必须优先生存时长：主队重甲战巡扛线+维修奶船，增援5艘不占人口；配置前先查实例库。"></textarea>
            <div class="actions">
                <button class="btn gold" onclick="createManualSkill()">💾 创建 Skill</button>
            </div>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script src="js/kb.js"></script>
<script src="js/qa.js"></script>
<script src="js/agent.js"></script>
<script src="js/skills.js"></script>
<script>
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg,type){
    const t=document.getElementById('toast');
    t.textContent=msg; t.className='toast '+type+' show';
    setTimeout(()=>t.classList.remove('show'),3000);
}

function renderSkills(){
    const skills=SkillSystem.loadSkills();
    document.getElementById('skillCnt').textContent='('+skills.length+' 个 · 启用 '+skills.filter(s=>s.enabled).length+')';
    const list=document.getElementById('skillList');
    if(!skills.length){
        list.innerHTML='<div class="empty">暂无经验skill。去 <a href="chat.html" style="color:var(--blue)">AI对话</a> 给回答点赞，系统会自动沉淀经验。</div>';
        return;
    }
    list.innerHTML=skills.map((s,i)=>`
        <div class="card">
            <div class="card-head">
                <span class="name">⭐ ${esc(s.name)}</span>
                <span class="summary">${esc(s.summary)}</span>
                <span class="badge ${s.enabled?'ok':'no'}">${s.enabled?'已启用':'已停用'}</span>
                <span class="badge">👍 ${s.praise||0}</span>
            </div>
            <div class="card-body" id="sb_${i}">
                <b style="color:var(--gold)">触发词:</b> ${(s.keywords||[]).join('、')||'（无）'}
                <br><br><b>全文:</b>
                <code>${esc(s.content)}</code>
            </div>
            <div class="actions">
                <button class="btn" onclick="toggleBody('sb_${i}')">${''}查看全文</button>
                <button class="btn ${s.enabled?'red':'green'}" onclick="toggleSkill(${i})">${s.enabled?'停用':'启用'}</button>
                <button class="btn red" onclick="delSkill(${i})">删除</button>
            </div>
            <div class="meta">创建 ${new Date(s.createdAt).toLocaleString('zh-CN')} · ${s.lastUsed?'最近使用 '+new Date(s.lastUsed).toLocaleString('zh-CN'):'尚未被注入'}</div>
        </div>`).join('');
}
function toggleSkill(i){
    const s=SkillSystem.loadSkills()[i]; if(!s) return;
    s.enabled=!s.enabled;
    SkillSystem.saveSkills(SkillSystem.loadSkills());
    renderSkills(); toast(s.enabled?'已启用':'已停用','ok');
}
function delSkill(i){
    if(!confirm('删除该skill？')) return;
    const arr=SkillSystem.loadSkills(); arr.splice(i,1); SkillSystem.saveSkills(arr);
    renderSkills(); toast('已删除','ok');
}

function renderTools(){
    const tools=SkillSystem.loadTools();
    document.getElementById('toolCnt').textContent='('+tools.length+' 个 · 激活 '+tools.filter(t=>t.status==='active').length+')';
    const list=document.getElementById('toolList');
    if(!tools.length){
        list.innerHTML='<div class="empty">暂无自定义工具。AI 在对话中判断需要时会自主创建，或在上方手写。</div>';
        return;
    }
    list.innerHTML=tools.map((t,i)=>`
        <div class="card">
            <div class="card-head">
                <span class="name">🧰 ${esc(t.name)}</span>
                <span class="summary">${esc(t.purpose||t.description||'')}</span>
                <span class="badge ${t.status==='active'?'ok':t.status==='pending'?'pending':'no'}">${t.status==='active'?'✅已激活':t.status==='pending'?'⏳待自检':'⛔已禁用'}</span>
            </div>
            <div class="card-body" id="tb_${i}">
                <b>作用标注:</b> ${esc(t.purpose||'（无）')}
                <br><br><b>逻辑依据（自检）:</b>
                <div class="basis">${esc(t.logic_basis||'（未自检）')}</div>
                <b>代码:</b>
                <code>${esc(t.code)}</code>
                ${(t.errorLog&&t.errorLog.length)?'<b style="color:var(--red)">修复记录:</b> '+t.errorLog.slice(-2).map(e=>esc('['+new Date(e.time).toLocaleString('zh-CN')+'] '+e.error.substring(0,100))).join('<br>')+'' : ''}
            </div>
            <div class="actions">
                <button class="btn" onclick="toggleBody('tb_${i}')">查看全文/依据</button>
                <button class="btn ${t.status==='active'?'red':'green'}" onclick="toggleTool(${i})">${t.status==='active'?'停用':'启用'}</button>
                <button class="btn gold" onclick="recheckTool(${i})">重新自检</button>
                <button class="btn red" onclick="delTool(${i})">删除</button>
            </div>
            <div class="meta">创建 ${new Date(t.createdAt).toLocaleString('zh-CN')}${t.status!=='active'?' · 未通过自检的工具不会注册进AI工具集':''}</div>
        </div>`).join('');
}
function toggleBody(id){
    const el=document.getElementById(id);
    if(el) el.classList.toggle('show');
}
function toggleTool(i){
    const arr=SkillSystem.loadTools(); const t=arr[i]; if(!t) return;
    if(t.status==='disabled') t.status='active'; else if(t.status==='active') t.status='disabled';
    SkillSystem.saveTools(arr);
    renderTools(); toast('状态已更新','ok');
}
async function recheckTool(i){
    const arr=SkillSystem.loadTools(); const t=arr[i]; if(!t) return;
    toast('⏳ 自检中...','ok');
    try{
        const r=await SkillSystem.selfCheckTool(t);
        t.status=r.ok?'active':'disabled';
        t.logic_basis=r.basis;
        SkillSystem.saveTools(arr);
        renderTools();
        toast(r.ok?'✅ 自检通过，已激活':'❌ 自检未通过: '+r.basis.substring(0,50),r.ok?'ok':'err');
    }catch(e){ toast('❌ 自检失败: '+String(e.message||e).substring(0,60),'err'); }
}
function delTool(i){
    if(!confirm('删除该工具？')) return;
    const arr=SkillSystem.loadTools(); arr.splice(i,1); SkillSystem.saveTools(arr);
    renderTools(); toast('已删除','ok');
}
async function createManualTool(){
    const name=document.getElementById('nt_name').value.trim();
    const purpose=document.getElementById('nt_purpose').value.trim();
    const code=document.getElementById('nt_code').value.trim();
    if(!name||!code){ toast('请填写工具名称和代码','err'); return; }
    toast('⏳ 自检中（语法编译 + LLM逻辑审查）...','ok');
    try{
        const tool={id:'tool_'+Date.now(), name, purpose, description:purpose, parameters:{type:'object',properties:{}}, code, status:'pending', logic_basis:'', createdAt:Date.now(), errorLog:[]};
        const check=await SkillSystem.selfCheckTool(tool);
        tool.status=check.ok?'active':'disabled';
        tool.logic_basis=check.basis||'';
        const arr=SkillSystem.loadTools(); arr.unshift(tool); SkillSystem.saveTools(arr);
        document.getElementById('nt_name').value=''; document.getElementById('nt_purpose').value=''; document.getElementById('nt_code').value='';
        renderTools();
        toast(check.ok?'✅ 自检通过，工具已激活':'❌ 自检未通过，已禁用（查看依据）', check.ok?'ok':'err');
    }catch(e){ toast('❌ 创建失败: '+String(e.message||e).substring(0,80),'err'); }
}

// ---- 手写新 Skill ----
function createManualSkill(){
    const name=document.getElementById('ns_name').value.trim();
    const summary=document.getElementById('ns_summary').value.trim();
    const keywords=(document.getElementById('ns_keywords').value||'').split(/[,，]/).map(s=>s.trim()).filter(Boolean).slice(0,5);
    const content=document.getElementById('ns_content').value.trim();
    if(!name||!content){ toast('请填写 Skill 名称和内容','err'); return; }
    try{
        const r=JSON.parse(SkillSystem.createSkillFromRequest({name, summary, content, keywords}));
        if(r.ok){
            renderSkills();
            document.getElementById('ns_name').value=''; document.getElementById('ns_summary').value='';
            document.getElementById('ns_keywords').value=''; document.getElementById('ns_content').value='';
            toast('✅ 已创建 skill「'+r.name+'」','ok');
        }else toast('❌ '+r.error,'err');
    }catch(e){ toast('❌ 创建失败: '+String(e.message||e).substring(0,80),'err'); }
}

renderSkills(); renderTools();

// 手机端底部 Tab
let mt=document.createElement('div'); mt.id='mobileTabbar';
mt.innerHTML='<button class="tab" onclick="location.href=\'chat.html\'"><span class="ti">💬</span>对话</button>'+
  '<button class="tab active" onclick="location.href=\'skills.html\'"><span class="ti">🧠</span>技能工具</button>'+
  '<button class="tab" onclick="location.href=\'features.html\'"><span class="ti">🗺️</span>功能</button>'+
  '<button class="tab" onclick="location.href=\'settings.html\'"><span class="ti">⚙️</span>设置</button>';
document.body.appendChild(mt);
function applyMobile(){ document.body.classList.toggle('mobile-ui', window.matchMedia('(max-width:700px) and (max-aspect-ratio:1/1)').matches); }
applyMobile(); window.addEventListener('resize',applyMobile); window.addEventListener('orientationchange',applyMobile);
</script>
</body>
</html>
