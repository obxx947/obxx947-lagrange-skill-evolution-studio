<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>战舰配队 — 拉格朗日智能体</title>
<link rel="icon" href="data:,">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Microsoft YaHei','PingFang SC',sans-serif;background:#0a0e1a;color:#e8f4ff;min-height:100vh}
:root{--bg2:#111827;--card:#1a2332;--border:#2d4a6f;--blue:#4a9eff;--cyan:#00d4ff;--gold:#ffd700;--green:#2ed573;--red:#ff4757;--t1:#e8f4ff;--t2:#8ba3c7;--t3:#5a7a9a}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.topbar .logo{font-size:0.86rem;font-weight:800;white-space:nowrap;background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar .tabs{display:flex;gap:6px}
.topbar .tabs button{white-space:nowrap;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--t2);border-radius:8px;padding:5px 10px;font-size:0.68rem;cursor:pointer;font-family:inherit}
.topbar .tabs button.on{color:#fff;border-color:var(--cyan);background:rgba(0,212,255,.14)}
.topbar .links{display:flex;gap:4px;margin-left:auto}
.topbar .links a{color:var(--t2);text-decoration:none;font-size:0.66rem;padding:4px 7px;border-radius:6px;white-space:nowrap}
.topbar .links a:hover{color:#fff;background:rgba(255,255,255,.05)}
.container{max-width:820px;margin:0 auto;padding:14px 14px 190px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card h3{font-size:0.8rem;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.card h3 .cnt{font-size:0.62rem;color:var(--t3);font-weight:400}
input[type=text],input:not([type]),textarea,select{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:8px;color:var(--t1);padding:8px 10px;font-size:0.76rem;outline:none;font-family:inherit;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
textarea{min-height:52px;resize:vertical}
.btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--t2);border-radius:8px;padding:6px 12px;font-size:0.7rem;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:hover{color:var(--t1);border-color:var(--blue)}
.btn.pri{background:rgba(0,212,255,.16);border-color:var(--cyan);color:#fff}
.btn.cyan{background:rgba(74,158,255,.14);border-color:var(--blue);color:#cfe6ff}
.btn.green{color:var(--green);border-color:var(--green)}
.btn.red{color:var(--red);border-color:var(--red)}
.btn.gold{color:var(--gold);border-color:var(--gold)}
.btn.full{width:100%;padding:9px;font-size:0.78rem}
.ftabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0 4px}
.ftab{display:flex;align-items:center;gap:6px;background:rgba(74,158,255,.12);border:1px solid var(--blue);border-radius:8px;padding:5px 8px;font-size:0.72rem;cursor:pointer}
.ftab.on{background:rgba(0,212,255,.2);border-color:var(--cyan);color:#fff}
.ftab .x{color:var(--red);font-weight:700;padding:0 2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.sw{display:flex;align-items:center;gap:6px;font-size:0.72rem;color:var(--t2);flex:0 0 auto}
.sec{font-size:0.76rem;font-weight:700;color:var(--gold);margin:6px 0 8px;display:flex;align-items:center;gap:6px}
.shiprow{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);border:1px solid var(--border);border-radius:10px;padding:7px 9px;margin-bottom:7px}
.shiprow .badge{flex:0 0 auto;min-width:26px;height:26px;border-radius:50%;background:rgba(46,213,115,.16);border:1px solid var(--green);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700}
.shiprow .nm{flex:1;min-width:0;font-size:0.74rem;line-height:1.3}
.shiprow .nm small{display:block;color:var(--t3);font-size:0.6rem}
.pos{flex:0 0 auto;font-size:0.58rem;padding:1px 6px;border-radius:6px;border:1px solid var(--cyan);color:var(--cyan);font-family:inherit;cursor:pointer;background:rgba(0,212,255,.06)}
.pos.前{border-color:var(--red);color:var(--red)}
.pos.后{border-color:var(--gold);color:var(--gold)}
.qty{flex:0 0 auto;display:flex;align-items:center;gap:4px}
.qty button{width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--t1);font-size:0.85rem;line-height:1;cursor:pointer}
.qty span{min-width:22px;text-align:center;font-size:0.76rem;font-weight:700}
.qty.over button,.qty.over span{color:var(--red);border-color:var(--red)}
/* 母舰载机区 */
.airbox{margin:-4px 0 7px 34px;border-left:2px solid rgba(0,212,255,.25);padding-left:8px}
.airline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:3px 0;font-size:0.66rem}
.airkind{color:var(--cyan);flex:0 0 auto;white-space:nowrap}
.airkind b{color:var(--t2);font-weight:400}
.airlist{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px}
.airitem{background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:6px;padding:2px 6px;white-space:nowrap}
.airitem .x{color:var(--red);font-style:normal;margin-left:5px;cursor:pointer;font-weight:700}
.empty{color:var(--t3);font-size:0.7rem;text-align:center;padding:14px}
.stats{position:fixed;left:0;right:0;bottom:0;background:#0d1420;border-top:1px solid var(--border);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:60}
.stats .g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:820px;margin:0 auto}
.stats .cell{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:5px 6px;text-align:center}
.stats .cell b{display:block;font-size:0.78rem;color:var(--t1)}
.stats .cell i{font-style:normal;font-size:0.58rem;color:var(--t3)}
.stats .cell.gold b{color:var(--gold)} .stats .cell.cyan b{color:var(--cyan)} .stats .cell.green b{color:var(--green)} .stats .cell.red b{color:var(--red)}
.stats .acts{display:flex;gap:8px;max-width:820px;margin:8px auto 0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:2000;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px 90px}
.overlay.show{display:flex}
.modal{background:#0f1626;border:1px solid var(--border);border-radius:14px;max-width:760px;width:100%;padding:14px 14px 16px}
.modal h3{font-size:0.9rem;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* 选船/载机弹窗：网格内滚动，底部确认栏固定（不用滚到底） */
.picker-modal{max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.pk-scroll{flex:1;overflow-y:auto;min-height:120px;padding-right:2px}
.pk-foot{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);position:sticky;bottom:0;background:#0f1626}
/* 载机数量列表 */
.qty-list{max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.qty-list button{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--t1);border-radius:8px;padding:9px;font-size:0.82rem;cursor:pointer;font-family:inherit}
.qty-list button.on{background:rgba(0,212,255,.18);border-color:var(--cyan);color:#fff;font-weight:700}
.pcard{position:relative;background:rgba(0,0,0,.22);border:1px solid var(--border);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer;transition:all .12s}
.pcard .pop{position:absolute;left:5px;top:5px;min-width:22px;height:22px;border-radius:50%;background:rgba(46,213,115,.16);border:1px solid var(--green);color:var(--green);font-size:0.64rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.pcard .used{position:absolute;right:5px;top:5px;font-size:0.54rem;padding:1px 5px;border-radius:6px;background:rgba(74,158,255,.18);border:1px solid var(--blue);color:var(--blue)}
.pcard .nm{font-size:0.7rem;line-height:1.3;margin-top:20px;word-break:break-word}
.pcard.sel{border-color:var(--cyan);background:rgba(0,212,255,.12)}
.pcard.sel:after{content:'已选';position:absolute;left:5px;bottom:5px;font-size:0.52rem;color:var(--cyan)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.filters button{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--t3);border-radius:8px;padding:5px 10px;font-size:0.66rem;cursor:pointer;font-family:inherit}
.filters button.on{color:#fff;border-color:var(--cyan);background:rgba(0,212,255,.14)}
.slot{margin-bottom:12px;border-top:1px solid rgba(255,255,255,.07);padding-top:9px}
.slot .st{display:flex;align-items:center;gap:8px;font-size:0.74rem;color:var(--gold);font-weight:700;margin-bottom:7px}
.slot .st em{width:22px;height:22px;border-radius:6px;background:rgba(74,158,255,.18);border:1px solid var(--blue);color:var(--cyan);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:0.7rem}
.var{display:flex;gap:8px;align-items:flex-start;background:rgba(0,0,0,.22);border:1px solid var(--border);border-radius:9px;padding:7px 9px;margin-bottom:6px;cursor:pointer}
.var.sel{border-color:var(--cyan);background:rgba(0,212,255,.1)}
.var .vname{flex:1;min-width:0;font-size:0.72rem}
.var .vname b{font-weight:700}
.var .vname small{display:block;color:var(--t3);font-size:0.6rem;margin-top:2px;line-height:1.4}
.var .core{font-size:0.54rem;padding:1px 5px;border-radius:6px;background:rgba(255,215,0,.14);border:1px solid var(--gold);color:var(--gold);margin-left:5px}
.var .none{color:var(--t3)}
.mine-item{background:rgba(0,0,0,.22);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px}
.mine-item .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mine-item .hd .t{font-size:0.78rem;font-weight:700}
.mine-item .hd .d{font-size:0.58rem;color:var(--t3)}
.mine-item .stat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.mine-item .stat div{font-size:0.62rem;color:var(--t3)}
.mine-item .stat b{color:var(--t1);font-size:0.72rem;display:block}
.toast{position:fixed;top:16px;right:16px;padding:9px 16px;border-radius:8px;font-size:0.76rem;z-index:9999;transition:all .3s;opacity:0;transform:translateY(-10px);pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:#1a3a2a;border:1px solid var(--green);color:var(--green)}
.toast.err{background:#3a1a1a;border:1px solid var(--red);color:var(--red)}
.hide{display:none!important}
.hint{font-size:0.62rem;color:var(--t3);line-height:1.5}
.stim{display:flex;flex-direction:column;gap:6px}
.stim-item{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:0.74rem;cursor:pointer}
.stim-item.on{border-color:var(--cyan);background:rgba(0,212,255,.13);color:#fff}
.stim-item input{accent-color:var(--cyan)}
</style>
</head>
<body>
<div class="topbar">
    <div class="logo">⚓ 战舰配队</div>
    <div class="tabs">
        <button id="tabEditor" class="on" onclick="switchTab('editor')">🛠️ 配队</button>
        <button id="tabMine" onclick="switchTab('mine')">📁 我的配队</button>
    </div>
    <div class="links">
        <a href="chat.html">🤖 AI对话</a>
        <a href="ships.html">🚀 舰船库</a>
        <a href="index.html">⚓ 模拟器</a>
    </div>
</div>

<div class="container">
  <!-- ============ 编辑器 ============ -->
  <div id="editor">
    <div class="card">
        <input id="planName" placeholder="请输入方案名称" oninput="cur.name=this.value">
        <div style="height:8px"></div>
        <textarea id="planDesc" placeholder="请输入方案介绍" oninput="cur.desc=this.value"></textarea>
        <div class="ftabs" id="fleetTabs"></div>
        <div class="row" style="margin-top:8px">
            <select id="flagship" onchange="setFlagship(this.value)"></select>
            <label class="sw"><input type="checkbox" id="swAdd" onchange="setFlag('addPoint',this.checked)">加点</label>
            <label class="sw"><input type="checkbox" id="swStitch" onchange="setFlag('stitch',this.checked)">缝合</label>
        </div>
    </div>

    <div class="card">
        <div class="sec">🛡️ 增援 <span class="cnt" id="rCnt"></span></div>
        <div id="reinforceList"></div>
        <button class="btn pri full" onclick="openPicker('reinforce')">➕ 增加战舰</button>
    </div>

    <div class="card">
        <div class="sec">⚔️ 主舰队 <span class="cnt" id="mCnt"></span></div>
        <div id="mainList"></div>
        <button class="btn pri full" onclick="openPicker('main')">➕ 增加战舰</button>
        <button class="btn gold full" style="margin-top:8px" onclick="saveToLib()">📚 存入配队库（供AI检索）</button>
    </div>
  </div>

  <!-- ============ 我的配队 ============ -->
    <div id="mine" class="hide">
        <div class="card">
            <div class="row">
                <input id="mineSearch" placeholder="🔍 搜索配置名称" oninput="renderMine()">
                <button class="btn red" style="flex:0 0 auto" onclick="delAllPlans()">删除全部</button>
            </div>
            <div class="row" style="margin-top:8px">
                <button class="btn gold" onclick="exportAllPlans()">📤 导出全部配队（JSON）</button>
                <button class="btn" onclick="document.getElementById('impFile').click()">📥 导入配队</button>
                <button class="btn" onclick="exportLib()">📚 导出配队库</button>
                <button class="btn" onclick="document.getElementById('impLibFile').click()">📚 导入配队库</button>
            </div>
            <input type="file" id="impFile" accept=".json" style="display:none" onchange="doImport(this)">
            <input type="file" id="impLibFile" accept=".json" style="display:none" onchange="doImportLib(this)">
            <div class="hint" style="margin-top:6px">配队库=给AI检索用的知识（单独导出/导入）；「导出全部配队」会把"我的配队"全部导出成一个 JSON，可发给我入库。</div>
        </div>
        <div class="sec">📚 配队库（AI 可检索） <span class="cnt" id="libCnt"></span></div>
        <div id="libList"></div>
        <div class="sec">📁 我的配队</div>
        <div id="mineList"></div>
    </div>
</div>

<!-- 底部统计 -->
<div class="stats">
    <div class="g">
        <div class="cell green"><b id="stPop">0</b><i>舰队人口</i></div>
        <div class="cell cyan"><b id="stAir">0</b><i>舰载机</i></div>
        <div class="cell gold"><b id="stRein">0</b><i>增援舰</i></div>
        <div class="cell"><b id="stHp">0万</b><i>总结构</i></div>
        <div class="cell red"><b id="stAnti">0</b><i>对舰/分</i></div>
        <div class="cell red"><b id="stAA">0</b><i>防空/分</i></div>
        <div class="cell red"><b id="stSiege">0</b><i>攻城/分</i></div>
        <div class="cell"><b id="stMods">0</b><i>模块数</i></div>
    </div>
    <div class="acts">
        <button class="btn pri" style="flex:1" onclick="savePlan()">💾 保存方案</button>
        <button class="btn gold" style="flex:1" onclick="toSimulator()">⚔️ 复制到模拟器</button>
        <button class="btn cyan" style="flex:1" onclick="sendToAI()">🤖 发给AI分析/改进</button>
        <button class="btn" style="flex:1" onclick="newPlan()">➕ 新建方案</button>
    </div>
</div>

<!-- 复制到模拟器：选择目标舰队 -->
<div class="overlay" id="simTargetModal">
    <div class="modal" style="max-width:420px">
        <h3><span>⚔️ 复制到战斗模拟器</span><button class="btn" onclick="closeSimTarget()">✕</button></h3>
        <div style="font-size:0.72rem;color:var(--t2);margin-bottom:8px">选择要加入的舰队：</div>
        <div id="simTargetList" class="stim"></div>
        <div style="font-size:0.72rem;color:var(--t2);margin:12px 0 6px">加入方式：</div>
        <div class="stim">
            <label class="stim-item on"><input type="radio" name="simMode" value="append" checked> 追加（与模拟器里现有舰船合并）</label>
            <label class="stim-item"><input type="radio" name="simMode" value="replace"> 覆盖（清空该舰队后放入）</label>
        </div>
        <div class="pk-foot">
            <button class="btn" style="flex:1" onclick="closeSimTarget()">取消</button>
            <button class="btn pri" style="flex:2" onclick="simConfirm()">确认并跳转</button>
        </div>
    </div>
</div>

<!-- 选船弹窗 -->
<div class="overlay" id="pickModal">
    <div class="modal picker-modal">
        <h3><span id="pkTitle">选择舰船</span><button class="btn" onclick="closePicker()">✕</button></h3>
        <div class="filters" id="pkFilters"></div>
        <div class="grid3 pk-scroll" id="pkGrid"></div>
        <div class="pk-foot">
            <button class="btn" style="flex:1" onclick="closePicker()">取消</button>
            <button class="btn pri" style="flex:2" onclick="confirmPick()">确认选择（<span id="pkSel">0</span>）</button>
        </div>
    </div>
</div>

<!-- 载机数量弹窗 -->
<div class="overlay" id="qtyModal">
    <div class="modal" style="max-width:360px">
        <h3><span id="qmTitle">选择数量</span><button class="btn" onclick="closeQty()">✕</button></h3>
        <div id="qmBody" class="qty-list"></div>
        <div class="pk-foot">
            <button class="btn red" id="qmDel" style="flex:1;display:none" onclick="airDelete()">移除该载机</button>
            <button class="btn pri" style="flex:2" onclick="airSubmit()">确认</button>
        </div>
    </div>
</div>

<!-- 模块弹窗 -->
<div class="overlay" id="modModal">
    <div class="modal">
        <h3><span id="mmTitle">选择模块</span><button class="btn" onclick="closeMods()">✕</button></h3>
        <div id="mmBody"></div>
        <div style="display:flex;gap:8px;margin-top:6px">
            <button class="btn" style="flex:1" onclick="closeMods()">取消</button>
            <button class="btn pri" style="flex:2" onclick="saveMods()">保存模块</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/kb.js"></script>
<script src="js/user_ships.js"></script>
<script src="js/fleet_io.js"></script>
<script src="js/fleet_check.js"></script>
<script src="js/fleet_lib.js"></script>
<script>
/* ================= 数据层 ================= */
const KEY='lagrange_fleets';
const TYPES=[['frigate','护卫舰'],['destroyer','驱逐舰'],['cruiser','巡洋舰'],['battlecruiser','战巡'],['battleship','战列'],['aircraftcarrier','航母'],['support','支援']];
const TYPE_LABEL={frigate:'护卫舰',destroyer:'驱逐舰',cruiser:'巡洋舰',corvette:'护航艇',fighter:'战机',battlecruiser:'战列巡洋舰',battleship:'战列舰',aircraftcarrier:'航空母舰',support:'支援舰'};
const SUPER=['battlecruiser','battleship','aircraftcarrier','support'];
let ALL=[], ALLMAP={};
let store={plans:[]};
let cur=null;                 // 当前编辑方案
let pickMode='ship', pickSection=null, pickSel=[], pickFilter='', airKind='fighter', pickIdx=-1, pickSlot='';
let modSection=null, modIdx=-1, modDraft={};

function toast(m,t){ const e=document.getElementById('toast'); e.textContent=m; e.className='toast '+(t||'ok')+' show'; setTimeout(()=>e.classList.remove('show'),2600); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function typeLabel(t){ return TYPE_LABEL[t]||t||''; }
function isSuper(t){ return SUPER.indexOf(t)!==-1; }
function getShip(id){ return ALLMAP[id]||null; }
function n1(x){ return Math.round(x*10)/10; }
function wan(x){ return x>=10000? (x/10000).toFixed(1)+'万' : String(Math.round(x)); }

/* ---- 以下载机位/模块槽位逻辑统一委托给 js/fleet_check.js（唯一实现，避免与校验器分叉） ---- */
function slotsOf(ship){ return FleetCheck.slotsOf(ship); }
/* 计算某舰(含所选模块)的 对舰/防空/攻城 DPM 与 是否带机库
   注意：模块槽「未装模块」时该槽不计武器/机库（不再默认回退到第一个变体） */
function shipDpm(ship, mods){
    const r={antiShip:0,antiAir:0,siege:0,hangar:0,wd:0};
    if(!ship||!ship.modules) return r;
    Object.keys(ship.modules).forEach(k=>{
        const g=ship.modules[k];
        if(!g) return;
        let node=null;
        if(g.type==='moduleGroup' && g.variants){
            const sel=(mods&&mods[k])||'';
            if(!sel) return;                       // 未选模块 → 空槽，不计
            node = g.variants[sel];
        } else { node=g; }
        if(!node) return;
        if(node.type==='hangar') r.hangar++;
        (node.weapons||[]).forEach(w=>{
            const d=w.dpm||{};
            r.antiShip += (d.antiShip||0); r.antiAir += (d.antiAir||0); r.siege += (d.siege||0); r.wd++;
        });
    });
    return r;
}
/* ===== 配队通用工具 ===== */
const POS_LIST=['前排','中排','后排'];
function defPos(ship){ const p=ship&&ship.position; return POS_LIST.indexOf(p)>=0?p:'中排'; }
function cyclePos(sec,i){
    const s=activeFleet()[sec][i]; if(!s) return;
    if(sec==='reinforce'){ toast('增援舰不设站位（增援不占人口、不排阵型）'); return; }
    const cur=s.pos||defPos(getShip(s.id)||{});
    s.pos=POS_LIST[(POS_LIST.indexOf(cur)+1)%POS_LIST.length];
    renderAll();
}
// 该型舰在「主舰队+增援」里的合计已用数量（服役上限是整队口径）
function usedTotal(id){
    const af=activeFleet(); let n=0;
    ['main','reinforce'].forEach(sec=>af[sec].forEach(x=>{ if(x.id===id) n+=x.qty; }));
    return n;
}
/* 旗舰 key：'main|序号' / 'reinforce|序号'
   用序号而不是舰船 id —— 因为同一艘舰可以有多套模块组合（多条独立条目），id 会重复。
   兼容旧数据：'main|<舰船id>' 与裸 <舰船id> 都会解析成对应条目的序号。 */
function flagKey(){
    const af=activeFleet(); const v=af.flagship||'';
    if(!v) return '';
    if(v.indexOf('|')>=0){
        const p=v.split('|'), sec=p[0], tail=p[1];
        if(!af[sec]) return '';
        if(/^\d+$/.test(tail)) return af[sec][parseInt(tail,10)] ? (sec+'|'+tail) : '';
        const j=af[sec].findIndex(s=>s.id===tail);          // 旧格式：按舰船 id 找第一条
        return j>=0 ? (sec+'|'+j) : '';
    }
    for(const sec of ['main','reinforce']){ const j=af[sec].findIndex(s=>s.id===v); if(j>=0) return sec+'|'+j; }
    return '';
}
/* 导出给模拟器/配队库用的「旗舰舰船 id」 */
function flagshipShipId(){
    const k=flagKey(); if(!k) return '';
    const p=k.split('|'), arr=activeFleet()[p[0]]||[];
    const s=arr[parseInt(p[1],10)];
    return s ? s.id : '';
}
function isFlagshipRow(sec,i){ return flagKey()===sec+'|'+i; }
// 清理指向已不存在条目的旗舰
function cleanFlagship(){
    const af=activeFleet();
    if(af.flagship && !flagKey()) af.flagship='';
}
// 某舰真实载机总数（战机+护航艇）
function airTotal(s){ return (s.air||[]).reduce((a,x)=>a+(x.qty||0),0); }

/* ===== 载机位模型 =====
   载机位 = 【来源】×【机型】 的组合，每个组合是独立的一位：
     - 独立容量（来自该模块/基础的 cap × 舰船数量）
     - 独立机型限制（size:'S' 仅中小型 / 'ALL' 可大型）
     - 独立按钮、独立计数
   例：太阳鲸 选 M2(战机ALL×8) + C1(战机ALL×5) → 两个战机位，各 8 / 各 5
   key 形如 'M2|fighter' / 'base|corvette'
   返回 [{key, mod, label, kind, allow, cap}] */
function airSlots(ship, mods, qty){ return FleetCheck.airSlots(ship, mods, qty); }
function airSlotOf(ship,mods,qty,key){ return FleetCheck.slotOf(ship,mods,qty,key); }
function airUsedIn(s,key){ return FleetCheck.usedIn(s,key); }
function hasAir(ship, mods, qty){ return FleetCheck.hasAir(ship,mods,qty); }
function kindLabel(kind, allow){
    const k=(kind==='fighter')?'✈战机':'🚤护航艇';
    if(kind!=='fighter') return k;
    return k+(allow==='ALL'?'（可大型）':'（仅中小型）');
}
/* 载机(某型)在整队（主舰队+增援）的服役已用数——服役上限是整队口径 */
function airUsedFleet(airId){
    const af=activeFleet(); let n=0;
    ['main','reinforce'].forEach(sec=>af[sec].forEach(s=>(s.air||[]).forEach(a=>{ if(a.id===airId) n+=(a.qty||0); })));
    return n;
}
/* 旧数据没有 slot 字段的载机 → 按机型自动落到第一个还有余量的同位 */
function assignSlots(s, ship){ return FleetCheck.assignSlots(s, ship); }
function stitching(){ return !!activeFleet().stitch; }
function aircraftName(a){ return a.name||a.raw||'?'; }
/* 再配一套（同一艘舰的另一种模块组合）：新增一条独立条目，数量 1。
   服役上限仍按该型舰在「主舰队+增援」的合计来卡。 */
function addConfig(sec,i){
    const af=activeFleet(); const src=af[sec][i]; if(!src) return;
    const ship=getShip(src.id)||{}; const lim=ship.serviceLimit||99;
    const used=usedTotal(src.id);
    if(!stitching() && used+1>lim){
        toast('「'+(ship.name||src.name)+'」已达服役上限 '+lim+' 艘（整队已用 '+used+'），无法再加一套','err');
        return;
    }
    const e={ id:src.id, name:src.name, pos:src.pos||defPos(ship), qty:1,
              mods:Object.assign({},src.mods||{}), air:[] };
    af[sec].splice(i+1, 0, e);          // 插在它后面，便于对比
    renderAll();
    toast('已新增一套配置（同型舰合计仍受服役上限约束），可改它的模块');
}

/* ================= 存储 ================= */
function loadStore(){ try{ store=JSON.parse(localStorage.getItem(KEY))||{plans:[]}; }catch(e){ store={plans:[]}; } if(!Array.isArray(store.plans)) store.plans=[]; }
function saveStore(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){ toast('保存失败','err'); } }

/* ================= 方案/舰队 ================= */
function blankFleet(n){ return {name:'舰队'+(n||1), flagship:'', addPoint:false, stitch:false, reinforce:[], main:[]}; }
/* 老数据回填：确保每条舰都有 pos / air 字段，并给没有 slot 的载机补上载机位 */
function fillPos(plan){
    (plan.fleets||[]).forEach(f=>['main','reinforce'].forEach(sec=>{
        (f[sec]||[]).forEach(s=>{
            if(!s.pos) s.pos=defPos(getShip(s.id)||{});
            if(!Array.isArray(s.air)) s.air=[];
            const ship=getShip(s.id);
            if(ship && s.air.length) assignSlots(s, ship);
        });
    }));
    return plan;
}
function newPlan(){
    cur={ id:'plan_'+Date.now(), name:'', desc:'', createdAt:Date.now(), updatedAt:Date.now(), fleets:[blankFleet(1)], active:0 };
    document.getElementById('planName').value=''; document.getElementById('planDesc').value='';
    renderAll(); toast('已新建方案');
}
function activeFleet(){ return cur.fleets[cur.active]||cur.fleets[0]; }
function switchFleet(i){ cur.active=i; renderAll(); }
function addFleet(){
    let n=cur.fleets.length+1;
    const used=cur.fleets.map(f=>f.name);
    while(used.indexOf('舰队'+n)>=0) n++;
    cur.fleets.push(blankFleet(n)); cur.active=cur.fleets.length-1; renderAll();
}
function delFleet(i){
    if(cur.fleets.length<=1){ toast('至少保留1个舰队','err'); return; }
    if(!confirm('删除该舰队？')) return;
    cur.fleets.splice(i,1); if(cur.active>=cur.fleets.length) cur.active=cur.fleets.length-1; renderAll();
}
function setFlagship(v){ activeFleet().flagship=v; renderStats(); }
function setFlag(k,v){ activeFleet()[k]=v; renderAll(); }

/* ================= 渲染 ================= */
function renderAll(){ renderTabs(); renderLists(); renderFlagship(); renderStats(); }
function renderTabs(){
    const f=cur.fleets, box=document.getElementById('fleetTabs');
    box.innerHTML=f.map((x,i)=>`<div class="ftab ${i===cur.active?'on':''}" onclick="switchFleet(${i})">${esc(x.name)} <span class="x" onclick="event.stopPropagation();delFleet(${i})">✕</span></div>`).join('')
        + `<button class="btn" onclick="addFleet()">＋</button>`;
    const af=activeFleet();
    document.getElementById('swAdd').checked=!!af.addPoint;
    document.getElementById('swStitch').checked=!!af.stitch;
}
function renderFlagship(){
    const af=activeFleet(); const sel=document.getElementById('flagship');
    const fk=flagKey();
    const rows=[['reinforce','增援'],['main','主舰队']];
    let html='<option value="">请选择旗舰</option>';
    rows.forEach(([sec,tag])=>{
        af[sec].forEach((s,idx)=>{
            const val=sec+'|'+idx;                 // 用序号，支持同型舰多套配置
            const mods=Object.keys(s.mods||{}).filter(k=>s.mods[k]).map(k=>s.mods[k]).join('/');
            html+=`<option value="${esc(val)}" ${fk===val?'selected':''}>${esc(s.name)}${mods?(' '+esc(mods)):''}${s.qty>1?(' ×'+s.qty):''}（${tag}）</option>`;
        });
    });
    sel.innerHTML=html;
}
function renderLists(){
    ['reinforce','main'].forEach(sec=>{
        const af=activeFleet(); const arr=af[sec];
        const box=document.getElementById(sec==='reinforce'?'reinforceList':'mainList');
        document.getElementById(sec==='reinforce'?'rCnt':'mCnt').textContent='('+arr.length+'种)';
        if(!arr.length){ box.innerHTML='<div class="empty">暂无舰船，点下方按钮添加</div>'; return; }
        box.innerHTML=arr.map((s,i)=>{
            const ship=getShip(s.id)||{};
            const shipLim=ship.serviceLimit||99;
            const usedAll=usedTotal(s.id);                 // 整队已用（主舰队+增援）
            const over=usedAll>shipLim;
            const slots=slotsOf(ship);                     // 只有「有变体可选的模块」才给模块按钮
            const showMods=isSuper(ship.type) && slots.length>0;
            const modStr=showMods? Object.keys(s.mods||{}).filter(k=>s.mods[k]).map(k=>s.mods[k]).join('/') : '';
            const pos=s.pos||defPos(ship);
            if(hasAir(ship,s.mods,s.qty)) assignSlots(s,ship);   // 老数据补齐 slot
            return `<div class="shiprow">
                <div class="badge">${ship.commandValue||0}</div>
                <div class="nm">${esc(s.name)}${isFlagshipRow(sec,i)?' ⭐':''}
                    <small>${typeLabel(ship.type)} · <b style="${over?'color:var(--red)':''}">服役 ${usedAll}/${shipLim}</b>${modStr?' · '+esc(modStr):''}</small></div>
                <button class="pos ${esc(pos)}" style="cursor:pointer;background:none" title="点击切换站位" onclick="cyclePos('${sec}',${i})">${esc(pos)}</button>
                ${showMods?`<button class="btn gold" style="flex:0 0 auto;padding:4px 8px" onclick="openMods('${sec}',${i})">${modStr?esc(modStr):'模块'}</button>`:''}
                ${showMods?`<button class="btn" style="flex:0 0 auto;padding:4px 8px" onclick="addConfig('${sec}',${i})" title="再配一套不同的模块组合（服役上限仍按该舰合计）">⧉</button>`:''}
                <div class="qty ${over?'over':''}">
                    <button onclick="chQty('${sec}',${i},-1)">−</button>
                    <span>${s.qty}</span>
                    <button onclick="chQty('${sec}',${i},+1)">＋</button>
                </div>
            </div>${(hasAir(ship,s.mods,s.qty)||(s.air||[]).length)?airHtml(sec,i,s,ship):''}`;
        }).join('');
    });
}
/* 母舰载机区：每个「来源×机型」载机位各一行，各带独立按钮与计数 */
function airHtml(sec,i,s,ship){
    const slots=airSlots(ship, s.mods, s.qty);
    const keys=slots.map(x=>x.key);
    const rows=slots.map(sl=>{
        const used=airUsedIn(s,sl.key), left=Math.max(0,sl.cap-used);
        const list=(s.air||[]).filter(x=>x.slot===sl.key);
        const items=list.map(a=>`<span class="airitem">${esc(aircraftName(a))} ×${a.qty}<i class="x" onclick="delAir('${sec}',${i},'${a.id}','${sl.key}')">删</i></span>`).join('');
        const tag=sl.mod==='base'?'基础':sl.mod;
        const oc=left>0?`onclick="openAirPicker('${sec}',${i},'${sl.key}')"`:'disabled title="该载机位已满"';
        return `<div class="airline">
            <span class="airkind"><b style="color:var(--cyan)">${esc(tag)}</b> ${kindLabel(sl.kind,sl.allow)} <b>${used}/${sl.cap}</b></span>
            <span class="airlist">${items||'<span style="color:var(--t3)">（未配置）</span>'}</span>
            <button class="btn ${left>0?'pri':''}" style="flex:0 0 auto;padding:3px 8px;font-size:0.62rem${left>0?'':';opacity:.45'}" ${oc}>＋ 剩 ${left}</button></div>`;
    });
    // 找不到对应载机位的载机（模块被换掉/取消后遗留）
    const orphan=(s.air||[]).filter(a=>!a.slot || keys.indexOf(a.slot)<0);
    if(orphan.length){
        rows.push(`<div class="airline"><span class="airkind" style="color:var(--red)">⚠ 无对应载机位</span>
            <span class="airlist">${orphan.map(a=>`<span class="airitem">${esc(aircraftName(a))} ×${a.qty}<i class="x" onclick="delAir('${sec}',${i},'${a.id}','${a.slot||''}')">删</i></span>`).join('')}</span></div>`);
    }
    if(!rows.length) return '';
    return `<div class="airbox">${rows.join('')}</div>`;
}
function delAir(sec,i,airId,slotKey){
    const s=activeFleet()[sec][i]; if(!s||!s.air) return;
    const k=s.air.findIndex(a=>a.id===airId && (a.slot||'')===(slotKey||''));
    if(k<0) return;
    const name=s.air[k].name, q=s.air[k].qty;
    s.air.splice(k,1); renderAll(); toast('已移除 '+name+' ×'+q);
}
function chQty(sec,i,d){
    const arr=activeFleet()[sec]; if(!arr[i]) return;
    const ship=getShip(arr[i].id)||{}; const lim=ship.serviceLimit||99;
    const nv=arr[i].qty+d;
    if(nv<1){
        const s=arr[i];
        if((s.air||[]).length && !confirm('「'+s.name+'」还挂着 '+airTotal(s)+' 架载机，确认一并移除？')) return;
        arr.splice(i,1); cleanFlagship(); renderAll(); return;
    }
    if(nv>lim && !stitching()){ toast('超过服役上限（'+lim+'）；开启「缝合」可忽略','err'); return; }
    // 服役上限是整队口径：主舰队 + 增援 合计不能超
    if(!stitching()){
        const after=usedTotal(arr[i].id)-arr[i].qty+nv;
        if(after>lim){ toast('超过服役上限（'+lim+'）：该型舰主舰队+增援合计已用 '+usedTotal(arr[i].id)+' 艘','err'); return; }
    }
    if(sec==='reinforce' && reinCount()+d>REIN_MAX){ toast('增援舰队最多只能配置'+REIN_MAX+'艘舰船','err'); return; }
    // 母舰减船：若某个载机位现有载机超出减船后的容量 → 必须先删载机
    if(d<0 && hasAir(ship, arr[i].mods, nv)){
        const s=arr[i];
        for(const sl of airSlots(ship, s.mods, nv)){
            const used=airUsedIn(s,sl.key);
            if(used>sl.cap){
                toast('「'+(sl.mod==='base'?'基础':sl.mod)+'」'+(sl.kind==='fighter'?'战机':'护航艇')+'位减船后只剩 '+sl.cap
                      +'，现有 '+used+' 架；请先删掉 '+(used-sl.cap)+' 架再减船','err');
                return;
            }
        }
    }
    arr[i].qty=nv; renderAll();
}
const REIN_MAX=9;   // 增援编队上限（源：配队星港「增援舰队最多只能配置9艘舰船」）
function reinCount(){ return activeFleet().reinforce.reduce((a,s)=>a+s.qty,0); }
function renderStats(){
    const af=activeFleet();
    let pop=0,hp=0,anti=0,aa=0,siege=0,mods=0,hangar=0,wd=0;
    af.main.forEach(s=>{
        const ship=getShip(s.id)||{};
        pop += (ship.commandValue||0)*s.qty;
        hp  += (ship.hp||0)*s.qty;
        const d=shipDpm(ship,s.mods);
        anti+=d.antiShip*s.qty; aa+=d.antiAir*s.qty; siege+=d.siege*s.qty; hangar+=d.hangar*s.qty; wd+=d.wd;
        mods+=Object.keys(s.mods||{}).filter(k=>s.mods[k]).length;
    });
    let rq=0, air=0, airCap=0;
    // 载机位统计：所有主/增援舰的载机位容量之和 vs 实际已配
    ['main','reinforce'].forEach(sec=>af[sec].forEach(s=>{
        const ship=getShip(s.id)||{};
        air += airTotal(s);
        airSlots(ship,s.mods,s.qty).forEach(sl=>{ airCap += sl.cap; });
    }));
    af.reinforce.forEach(s=>{ rq+=s.qty; const ship=getShip(s.id)||{}; const d=shipDpm(ship,s.mods); anti+=d.antiShip*s.qty; aa+=d.antiAir*s.qty; siege+=d.siege*s.qty; wd+=d.wd; });
    const D='—';
    document.getElementById('stPop').textContent=pop;
    document.getElementById('stAir').textContent=airCap?(air+'/'+airCap):String(air);
    document.getElementById('stRein').textContent=rq+'/'+REIN_MAX;
    document.getElementById('stHp').textContent=hp?wan(hp):D;
    document.getElementById('stAnti').textContent=wd?wan(anti):D;
    document.getElementById('stAA').textContent=wd?wan(aa):D;
    document.getElementById('stSiege').textContent=wd?wan(siege):D;
    document.getElementById('stMods').textContent=mods;
}

/* ================= 选船弹窗 ================= */
function openPicker(sec){
    if(!ALL.length){ toast('舰船数据加载中…','err'); return; }
    pickMode='ship';
    pickSection=sec; pickSel=[]; pickFilter='';
    document.getElementById('pkTitle').textContent=(sec==='reinforce'?'选择舰船 · 增援':'选择舰船 · 主舰队');
    document.getElementById('pkFilters').innerHTML='<button class="on" onclick="setPickFilter(\'\',this)">全部</button>'+TYPES.map(t=>`<button onclick="setPickFilter('${t[0]}',this)">${t[1]}</button>`).join('');
    renderPickGrid(); document.getElementById('pickModal').classList.add('show');
}
/* ================= 载机数量弹窗（1..min(载机位, 服役上限)；缝合开启则不受服役上限） ================= */
let qtyTarget=null, qtyPick=1;
function openAirQty(id){
    const s=activeFleet()[pickSection]&&activeFleet()[pickSection][pickIdx]; if(!s) return;
    const ship=getShip(s.id)||{};
    const a=getShip(id)||{};
    const sl=airSlotOf(ship,s.mods,s.qty,pickSlot);
    if(!sl){ toast('该载机位已不存在（模块可能被改动）','err'); return; }
    const cur=((s.air||[]).find(x=>x.id===id&&x.slot===sl.key)||{}).qty||0;
    const byCap=Math.max(0, sl.cap-(airUsedIn(s,sl.key)-cur));
    // 服役上限 = 整队（主舰队+增援）口径；缝合开启则忽略
    const servLeft=stitching()?9999:Math.max(0,(a.serviceLimit||99)-(airUsedFleet(id)-cur));
    const maxQty=Math.min(byCap, servLeft);
    if(maxQty<1){
        toast(byCap<1
            ? ('「'+(sl.mod==='base'?'基础':sl.mod)+'」载机位已满（'+airUsedIn(s,sl.key)+'/'+sl.cap+'），请先减少该位的载机')
            : ('该机型整队服役已达上限 '+(a.serviceLimit||99)+' 架，无法再加'),'err');
        return;
    }
    qtyTarget={ id, name:a.name||id, kind:sl.kind, slot:sl.key, cur, maxQty };
    qtyPick=cur>0?Math.min(cur,maxQty):1;
    document.getElementById('qmTitle').textContent=(a.name||id)+' · '+(sl.mod==='base'?'基础':sl.mod)+(sl.kind==='fighter'?'战机位':'护航艇位');
    document.getElementById('qmDel').style.display=cur>0?'block':'none';
    renderQtyList();
    document.getElementById('qtyModal').classList.add('show');
}
function renderQtyList(){
    const t=qtyTarget; if(!t) return;
    let h='';
    for(let i=1;i<=t.maxQty;i++) h+=`<button class="${i===qtyPick?'on':''}" onclick="qtyPick=${i};renderQtyList()">${i}</button>`;
    h+=`<div style="font-size:0.6rem;color:var(--t3);text-align:center;padding:6px">可选 1~${t.maxQty}（该载机位余量 / 整队服役上限${stitching()?' · 缝合已开，忽略服役上限':''}）</div>`;
    document.getElementById('qmBody').innerHTML=h;
}
function closeQty(){ document.getElementById('qtyModal').classList.remove('show'); }
function airSubmit(){
    const t=qtyTarget; if(!t) return;
    const s=activeFleet()[pickSection]&&activeFleet()[pickSection][pickIdx]; if(!s) return;
    const ship=getShip(s.id)||{}; const a=getShip(t.id)||{};
    const sl=airSlotOf(ship,s.mods,s.qty,t.slot);
    if(!sl){ toast('该载机位已不存在','err'); return; }
    const cur=((s.air||[]).find(x=>x.id===t.id&&x.slot===t.slot)||{}).qty||0;
    const byCap=Math.max(0, sl.cap-(airUsedIn(s,sl.key)-cur));
    const servLeft=stitching()?9999:Math.max(0,(a.serviceLimit||99)-(airUsedFleet(t.id)-cur));
    const q=Math.min(qtyPick, byCap, servLeft);
    if(q<1){ toast('该载机位余量不足，无法加入','err'); return; }
    s.air=s.air||[];
    const ex=s.air.find(x=>x.id===t.id && x.slot===t.slot);
    if(ex) ex.qty=q; else s.air.push({id:t.id, name:t.name, kind:t.kind, slot:t.slot, qty:q});
    closeQty(); renderAll();
    if(document.getElementById('pickModal').classList.contains('show')) renderPickGrid();   // 刷新选机弹窗的 ×N / 已用角标
    toast('已加入 '+t.name+' ×'+q);
}
function airDelete(){
    const t=qtyTarget; if(!t) return;
    const s=activeFleet()[pickSection]&&activeFleet()[pickSection][pickIdx]; if(!s) return;
    s.air=(s.air||[]).filter(x=>!(x.id===t.id && x.slot===t.slot));
    closeQty(); renderAll();

    toast('已移除 '+t.name);
}

/* 载机选择器：按【载机位】过滤（该位的机型限制 + 该位的剩余容量 + 整队服役上限） */
function openAirPicker(sec,i,slotKey){
    const s=activeFleet()[sec][i]; if(!s) return;
    const ship=getShip(s.id)||{};
    const sl=airSlotOf(ship,s.mods,s.qty,slotKey);
    if(!sl){ toast('该载机位不存在','err'); return; }
    pickMode='air'; pickSection=sec; pickIdx=i; pickSlot=slotKey; airKind=sl.kind; pickSel=[]; pickFilter='';
    document.getElementById('pkFilters').innerHTML='';
    renderPickGrid(); document.getElementById('pickModal').classList.add('show');
}
function setPickFilter(t,el){ pickFilter=t; document.querySelectorAll('#pkFilters button').forEach(b=>b.classList.remove('on')); el.classList.add('on'); renderPickGrid(); }
function renderPickGrid(){
    const af=activeFleet();
    document.getElementById('pkSel').textContent=pickSel.length;
    // —— 载机模式：按【载机位】过滤，点选后弹数量 ——
    if(pickMode==='air'){
        const s=af[pickSection]&&af[pickSection][pickIdx]; if(!s){ closePicker(); return; }
        const ship=getShip(s.id)||{};
        const sl=airSlotOf(ship,s.mods,s.qty,pickSlot);
        if(!sl){ closePicker(); toast('该载机位已不存在（模块可能被改动）','err'); return; }
        const used=airUsedIn(s,sl.key), left=Math.max(0,sl.cap-used);
        let list=ALL.filter(x=>x.type===sl.kind);
        if(sl.kind==='fighter' && sl.allow!=='ALL') list=list.filter(x=>x.airSize!=='large');  // 该位只能带中小型
        document.getElementById('pkGrid').innerHTML=list.map(x=>{
            const cur=((s.air||[]).find(a=>a.id===x.id&&a.slot===sl.key)||{}).qty||0;
            const fleet=airUsedFleet(x.id);            // 整队已用（含本舰）
            const lim=x.serviceLimit||99;
            const full=left<1 || (!stitching() && fleet>=lim);
            return `<div class="pcard" style="${full?';opacity:.45':''}" onclick="${full?'':('openAirQty('+JSON.stringify(x.id).replace(/"/g,'&quot;')+')')}">
                <div class="pop">${fleet}/${lim}</div>
                ${cur?`<div class="used">本舰 ×${cur}</div>`:''}
                <div class="nm">${esc(x.name)}${x.airSize==='large'?'<small style="display:block;color:var(--gold);font-size:0.54rem">大型</small>':''}</div></div>`;
        }).join('')||'<div class="empty">无可用载机</div>';
        document.getElementById('pkTitle').innerHTML=(sl.mod==='base'?'基础':esc(sl.mod))+' · '+kindLabel(sl.kind,sl.allow)
            +' ｜ '+esc(s.name)+`（本位居 ${used}/${sl.cap}，剩 ${left}）`;
        return;
    }
    // —— 舰船模式：只列舰船（排除战机/护航艇）；角标=整队已用/服役上限 ——
    const list=ALL.filter(s=>s.type!=='fighter'&&s.type!=='corvette').filter(s=>!pickFilter||s.type===pickFilter);
    document.getElementById('pkGrid').innerHTML=list.map(s=>{
        const sel=pickSel.indexOf(s.id)>=0;
        const u=usedTotal(s.id), lim=s.serviceLimit||99;
        const full=!stitching() && u>=lim;
        return `<div class="pcard ${sel?'sel':''}" style="${full?';opacity:.5':''}" onclick="togglePick('${s.id}')">
            <div class="pop">${s.commandValue||0}</div>
            <div class="used" style="${full?';border-color:var(--red);color:var(--red)':''}">${u}/${lim}</div>
            <div class="nm">${esc(s.name)}</div>
        </div>`;
    }).join('') || '<div class="empty">无匹配舰船</div>';
}
function togglePick(id){ const i=pickSel.indexOf(id); if(i>=0) pickSel.splice(i,1); else pickSel.push(id); renderPickGrid(); }
function confirmPick(){
    const af=activeFleet();
    // —— 载机模式：每次点选已在数量弹窗内完成，这里只是关闭 ——
    if(pickMode==='air'){ closePicker(); return; }
    const arr=af[pickSection];
    let added=0, capped=false, over=false;
    pickSel.forEach(id=>{
        const ship=getShip(id)||{};
        const lim=ship.serviceLimit||99;
        if(pickSection==='reinforce' && reinCount()+1>REIN_MAX){ capped=true; return; }
        // 服役上限按整队口径（主舰队+增援）
        if(!stitching() && usedTotal(id)+1>lim){ over=true; return; }
        const ex=arr.find(x=>x.id===id);
        if(ex){ if(!ex.pos) ex.pos=defPos(ship); ex.qty++; }
        else arr.push({id, name:ship.name||id, pos:defPos(ship), qty:1, mods:{}, air:[]});
        added++;
    });
    closePicker(); renderAll();
    toast(capped?('已加入 '+added+' 种；增援已达上限 '+REIN_MAX+' 艘')
        : over?('已加入 '+added+' 种；部分超出服役上限（开启「缝合」可忽略）')
        : ('已加入 '+added+' 种舰船'));
}

function saveMods(){

    const newKeys=airSlots(ship,newMods,s.qty).map(x=>x.key);

}

/* 载入 AI 传来的配队（先过校验器：非法载机等会被剔除并报出原因） */
function importFromAI(){
    const f=FleetIO.fromAI(); if(!f) return false;
    // AI 输出的原始结构 → 校验器结构（含 air 的 slot）
    const raw={ name:f.name||('AI配队 '+new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})),
                desc:f.desc||'', reason:f.reason||'', flagship:f.flagship||'',
                main:(f.main||[]).map(x=>Object.assign({air:[]},x)),
                reinforcement:(f.reinforce||f.reinforcement||[]).map(x=>Object.assign({air:[],pos:'增援'},x)) };
    // 载机（f.air 带 forId）归到对应舰
    (f.air||[]).forEach(a=>{
        const t=raw.main.find(x=>x.id===a.forId)||raw.reinforcement.find(x=>x.id===a.forId);
        if(t){ t.air=t.air||[]; t.air.push({id:a.id||'',name:a.name||'',kind:a.kind||'fighter',slot:a.slot||'',qty:a.qty||1}); }
    });
    let res=null;
    try{ res=FleetCheck.check(raw, {stitch:false}); }catch(e){ res=null; }
    const src = res ? res.fixed : raw;      // 校验器规整后的结构（非法载机已被剔除）
    cur={ id:'plan_'+Date.now(), name:raw.name, desc:raw.desc,
          createdAt:Date.now(), updatedAt:Date.now(), active:0, fleets:[blankFleet(1)] };
    const af=cur.fleets[0];
    const cv=(arr,defP)=>arr.map(s=>{ const sh=getShip(s.id)||{};
        return {id:s.id||'', name:s.name||s.raw||'', qty:Math.max(1,parseInt(s.qty,10)||1), mods:s.mods||{},
                pos:s.pos||defP||defPos(sh),
                air:(s.air||[]).map(a=>({id:a.id||'', name:a.name||'', kind:a.kind||'fighter', slot:a.slot||'', qty:a.qty||1}))}; });
    af.main=cv(src.main||[]);
    af.reinforce=[];
    let n=0; (src.reinforcement||[]).forEach(s=>{ const e=cv([s],'增援')[0]; if(e && n+(e.qty||1)<=REIN_MAX){ af.reinforce.push(e); n+=(e.qty||1); } });
    af.flagship=src.flagship||'';
    fillPos(cur);
    document.getElementById('planName').value=cur.name; document.getElementById('planDesc').value=cur.desc;
    renderAll();
    if(res){
        if(res.errors.length) showCheckReport(res, '已按「战舰配队」数据校正 AI 配队');
        else if(res.warnings.length) toast('提示：'+res.warnings.join('；'));
    }
    return true;
}
/* 校验结果面板（配队页权威口径）：列出被剔除/修正的内容 */
function showCheckReport(res, title){
    let box=document.getElementById('checkReport');
    if(!box){
        box=document.createElement('div'); box.id='checkReport';
        box.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9000;background:#2a1a1a;border-top:1px solid var(--red);padding:10px 14px;max-height:45vh;overflow-y:auto;font-size:0.72rem;line-height:1.6';
        document.body.appendChild(box);
    }
    box.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <b style="color:var(--red)">⚠ ${esc(title)}（以「战舰配队」数据为准）</b>
        <button class="btn" onclick="document.getElementById('checkReport').remove()">知道了</button></div>`
        + res.errors.map(e=>`<div style="color:#ff8a94">• ${esc(e)}</div>`).join('')
        + (res.stats?`<div style="color:var(--t2);margin-top:6px">校正后：人口 <b>${res.stats.pop}</b> · 增援 <b>${res.stats.reinShips}</b>/9 · 载机 <b>${res.stats.airCnt}</b>/${res.stats.airCap}</div>`:'');
}

/* ================= 配队库（AI 可检索） ================= */
function saveToLib(){
    const has=activeFleet().main.length||activeFleet().reinforce.length;
    if(!has){ toast('当前配队为空','err'); return; }
    let name=(cur.name||'').trim();
    if(!name){ name=(prompt('配队库名称（便于AI检索，如：420+5 护航抗伤队）')||'').trim(); if(!name) return; cur.name=name; document.getElementById('planName').value=name; }
    const line=(prompt('场景 与 标签（空格/逗号分隔，可空）\n例：护航抗伤 抗伤 420 大盾旗舰','')||'').trim();
    const parts=line?line.split(/[\s,，、\/]+/).filter(Boolean):[];
    const scenario=parts.length?parts[0]:'';
    const tags=parts.slice(1);
    const src=(prompt('来源（可空，如：A资料132 / 实战）','')||'').trim();
    const e=FleetLib.entryFromPlan(cur, {scenario, tags, source:src, note:cur.desc});
    FleetLib.upsert(e); renderMine(); toast('已存入配队库：'+e.name);
}
async function renderLib(){
    let list=[]; try{ list=await FleetLib.all(); }catch(e){ list=FleetLib.loadLocal().fleets||[]; }
    const cntEl=document.getElementById('libCnt'); if(cntEl) cntEl.textContent='('+list.length+' 套)';
    const box=document.getElementById('libList'); if(!box) return;
    if(!list.length){ box.innerHTML='<div class="empty">配队库为空。在「配队」里配好后点「📚 存入配队库」。</div>'; return; }
    box.innerHTML=list.map(e=>`
        <div class="mine-item">
            <div class="hd">
                <div><div class="t">${esc(e.name)}${e.scenario?' · '+esc(e.scenario):''}
                    ${e._from==='file'?'<span class="core" style="margin-left:6px">内置只读</span>':''}</div>
                <div class="d">人口 ${e.pop||0}+${e.reinforce||0}${e.tags&&e.tags.length?' · '+e.tags.map(esc).join(' / '):''}</div></div>
                <div style="display:flex;gap:6px">
                    <button class="btn" onclick="loadLibToEditor('${esc(e.id)}')">载入编辑</button>
                    ${e._from==='file'
                        ? `<button class="btn cyan" onclick="copyLibToLocal('${esc(e.id)}')">转为可编辑</button>`
                        : `<button class="btn red" onclick="delLib('${esc(e.id)}')">删除</button>`}
                </div>
            </div>
            ${e.note?'<div style="font-size:0.62rem;color:var(--t2);margin-top:6px;line-height:1.5">'+esc(String(e.note).substring(0,140))+'</div>':''}
        </div>`).join('');
}
function delLib(id){ if(!confirm('从配队库删除？')) return; FleetLib.remove(id); renderMine(); toast('已删除'); }
/* 内置(只读)条目 → 复制成同 id 的本地条目，本地覆盖内置，之后可编辑/删除（删除后恢复内置版） */
async function copyLibToLocal(id){
    const e=(await FleetLib.all()).find(x=>x.id===id); if(!e) return;
    const c=Object.assign({},e); delete c._from; c.createdAt=c.createdAt||Date.now();
    FleetLib.upsert(c); await renderLib(); toast('已转为可编辑（本地优先于内置）');
}
async function loadLibToEditor(id){
    let e=null;
    try{ e=(await FleetLib.all()).find(x=>x.id===id); }catch(err){ e=null; }
    if(!e) e=(FleetLib.loadLocal().fleets||[]).find(x=>x.id===id);
    if(!e){ toast('该配队条目不存在','err'); return; }
    cur={ id:'plan_'+Date.now(), name:e.name, desc:e.note||'', createdAt:Date.now(), updatedAt:Date.now(), active:0,
          fleets:[{ name:'舰队1', flagship:e.flagship||'', addPoint:false, stitch:false,
                    reinforce:(e.reinforceList||[]).map(x=>Object.assign({},x)),
                    main:(e.main||[]).map(x=>Object.assign({},x)) }] };
    fillPos(cur);
    document.getElementById('planName').value=cur.name; document.getElementById('planDesc').value=cur.desc;
    switchTab('editor'); renderAll(); toast('已载入编辑（另存为你的方案）');
}
/* 导出/导入 */
function download(name, text){
    const b=new Blob([text],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('已导出：'+name);
}
function exportAllPlans(){
    const plans=store.plans||[];
    if(!plans.length){ toast('没有已保存的配队','err'); return; }
    download('拉格朗日_我的配队_'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify({type:'plans',plans},null,2));
}
function exportLib(){
    const d=FleetLib.loadLocal();
    if(!(d.fleets||[]).length){ toast('配队库为空','err'); return; }
    download('拉格朗日_配队库_'+new Date().toISOString().slice(0,10)+'.json', FleetLib.exportAll());
}
function readFile(input, cb){
    const f=input.files&&input.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>cb(String(r.result)); r.readAsText(f,'utf-8'); input.value='';
}
function doImport(inp){
    readFile(inp, txt=>{
        let j=null; try{ j=JSON.parse(txt); }catch(e){ toast('JSON 解析失败','err'); return; }
        const arr=(j&&j.plans)?j.plans:(Array.isArray(j)?j:null);
        if(!arr){ toast('格式不对（应为 我的配队导出文件）','err'); return; }
        const idx={}; (store.plans||[]).forEach((p,i)=>idx[p.id]=i);
        let n=0,upd=0;
        arr.forEach(p=>{
            if(!p||!p.id) return;
            const i=idx[p.id];
            if(i===undefined){ store.plans.unshift(p); idx[p.id]=0; n++; }
            else if((p.updatedAt||0)>(store.plans[i].updatedAt||0)){ store.plans[i]=p; upd++; }
        });
        saveStore(); renderMine();
        toast('已导入 '+n+' 套'+(upd?('，更新 '+upd+' 套'):''));
    });
}
function doImportLib(inp){
    readFile(inp, txt=>{ const r=FleetLib.importJSON(txt); if(r.ok){ renderMine(); toast('配队库已导入（新增 '+r.added+'，共 '+r.total+'）'); } else toast(r.error,'err'); });
}

function switchTab(t){
    document.getElementById('editor').classList.toggle('hide', t!=='editor');
    document.getElementById('mine').classList.toggle('hide', t!=='mine');
    document.getElementById('tabEditor').classList.toggle('on', t==='editor');
    document.getElementById('tabMine').classList.toggle('on', t==='mine');
    if(t==='mine') renderMine();
}

/* ================= 初始化 ================= */
(async function init(){
    loadStore();
    try{
        await SHIP_DB.load();
        ALL=SHIP_DB.all();
        ALL.forEach(s=>{ ALLMAP[s.id]=s; });
    }catch(e){ toast('舰船数据加载失败','err'); }
    let imported=false;
    if(/[?&]import=1/.test(location.search)) imported=importFromAI();
    if(!imported) newPlan();
    else toast('已载入 AI 配置');
    renderMine();
})();
</script>
